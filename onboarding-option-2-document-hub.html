.rail{position:fixed;left:0;top:0;bottom:0;width:84px;background:#fff;z-index:5;display:flex;flex-direction:column;align-items:center;padding:22px 0 40px}
.logo{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;line-height:1.15;color:var(--navy);letter-spacing:-.01em}
.dots{display:grid;grid-template-columns:repeat(3,4px);gap:2.5px}
.dots i{width:4px;height:4px;background:var(--logo);border-radius:50%;display:block}
.rail .sp{flex:1}
.gear{color:var(--t2);font-size:19px;line-height:1}
.rail .hr{width:38px;height:1px;background:var(--bd);margin:20px 0}
.av{width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--brand-dk);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.stage{margin-left:84px;padding:48px 0 80px;display:flex;justify-content:center}
.card{background:#fff;border-radius:16px;width:1088px;max-width:calc(100% - 96px);padding:64px 144px 56px}
.col{max-width:800px;margin:0 auto}
.inset{max-width:684px;margin:0 auto}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
h1{font-size:24px;font-weight:500;letter-spacing:-.01em}
.pill-g{display:inline-block;background:var(--g100);color:var(--t-btn);font-size:13px;font-weight:500;padding:5px 13px;border-radius:20px;white-space:nowrap;flex:none;margin-top:5px}
.lede{font-size:14px;color:var(--t2);margin-top:6px;line-height:1.55;max-width:660px}
.grp{font-size:14px;color:var(--t2);margin:26px 0 10px}
.list{border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.list.flat{margin-top:26px}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.ic{width:24px;height:24px;border-radius:50%;background:var(--g100);flex:none;display:flex;align-items:center;justify-content:center}
.ic .ring{width:13px;height:13px;border:1.5px solid #475467;border-radius:50%;display:block}
.ic.on{background:var(--mint);color:var(--brand-ic);font-size:12px;font-weight:700}
.row .nm{font-size:15px;font-weight:500}
.tag{display:inline-block;background:var(--blue-bg);color:var(--blue);font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:16px;margin-left:9px;vertical-align:1px}
.row .rt{margin-left:auto;flex:none;width:84px;display:flex;justify-content:center;align-items:center}
.sign{font-family:inherit;background:#fff;border:1px solid var(--brand);color:var(--brand-dk);font-size:13.5px;font-weight:600;height:36px;width:84px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.sign:hover{background:var(--mint-2)}
.view{color:var(--t-btn);font-size:14px;cursor:pointer;text-decoration:none;height:36px;width:84px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:8px}
.view:hover{color:var(--brand-dk)}

.crumb{display:flex;align-items:center;justify-content:space-between;gap:16px}
.crumb a{display:inline-flex;align-items:center;gap:9px;color:var(--brand-dk);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.sub{font-size:14px;color:var(--t2);margin-top:5px}

.viewer{background:var(--g50);border:1px solid #EFF1F4;border-radius:8px;padding:11px;margin-top:26px}
.page{background:#fff;border:1px solid var(--bd);min-height:520px;padding:34px 78px 44px}
.page .plogo{display:flex;align-items:center;justify-content:center;gap:9px;font-size:19px;font-weight:700;color:var(--navy);line-height:1.05;margin-bottom:26px}
.page .plogo .dots{grid-template-columns:repeat(3,7px);gap:4px}
.page .plogo .dots i{width:7px;height:7px}
.page h3{font-size:13px;font-weight:700;text-align:center;color:#000;margin-bottom:22px}
.page h3.rule{border-bottom:2px solid #000;padding-bottom:9px;font-size:15px}
.page p{font-size:11.5px;line-height:1.62;color:#1D2939;margin-bottom:11px;text-align:justify}
.page h4{font-size:11.5px;font-weight:700;color:#000;margin:16px 0 9px}

.pg{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:22px}
.pg button{font-family:inherit;cursor:pointer;background:#fff;border:1px solid var(--bd2);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--t-btn);display:inline-flex;align-items:center;gap:7px}
.pg button:disabled{color:var(--t3);border-color:var(--bd);cursor:default}
.pg .n{border:0;background:transparent;color:var(--t2);min-width:34px;height:34px;padding:0;justify-content:center;font-weight:500;border-radius:8px}
.pg .n.on{background:var(--mint);color:var(--brand-dk);font-weight:600}
.pg .el{color:var(--t3);font-size:13px;padding:0 4px}

.notice{border:1px solid var(--bd2);background:var(--g25);border-radius:10px;padding:16px 18px;margin-top:34px;display:flex;gap:12px}
.notice .ico{color:var(--t2);font-size:15px;flex:none;margin-top:1px}
.notice .h{font-size:14px;font-weight:600;color:var(--t-btn);margin-bottom:3px}
.notice .b{font-size:13.5px;color:var(--t2);line-height:1.6}
.notice .b b{color:var(--t-btn);font-weight:600}

.sig{margin-top:36px}
.sig h2{font-size:18px;font-weight:600;margin-bottom:16px}
.lb{display:block;font-size:13px;color:var(--t-btn);font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;height:44px;border:1px solid var(--bd2);border-radius:8px;padding:0 14px;font-family:inherit;font-size:15px;color:var(--t1);background:#fff}
input[type=text]::placeholder{color:var(--t3)}
input[type=text]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,145,112,.13)}
.chk{display:flex;align-items:center;gap:11px;margin-top:18px;font-size:14.5px;color:var(--t1);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex:none}
.divider{border-top:1px solid var(--bd);margin-top:30px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.btn{font-family:inherit;border:0;border-radius:9px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer}
.pri{background:var(--grad);color:#fff}
.pri:hover{filter:brightness(1.06)}
.pri:disabled{background:var(--disabled);color:#fff;cursor:default;filter:none}
.sec{background:#fff;border:1px solid var(--bd2);color:var(--t-btn)}
.sec:hover{background:var(--g50)}

.card.rc{width:1164px;padding:52px 64px 44px}
.reg{display:flex;gap:76px}
.reg .nav{width:210px;flex:none;padding-top:4px}
.step{display:flex;align-items:flex-start;gap:13px;position:relative;padding-bottom:24px}
.step:last-child{padding-bottom:0}
.step .cir{width:26px;height:26px;border-radius:50%;background:var(--brand-ic);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;position:relative;z-index:1}
.step .ln{position:absolute;left:13px;top:28px;height:calc(100% - 24px);border-left:1px dashed #B7C4CB}
.step .lb2{font-size:14px;font-weight:600;color:var(--t1);padding-top:4px;line-height:1.35}
.step.now .lb2{color:var(--brand-ic)}
.reg .form{flex:1;min-width:0}
.reg h1{margin-bottom:28px}
.q{font-size:15px;font-weight:600;margin:28px 0 10px}
.q.first{margin-top:0}
.opt2{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--t1);padding:6px 0;cursor:pointer}
.opt2 input{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;flex:none}
.hint{font-size:13px;color:var(--t-btn);font-weight:500;margin:28px 0 6px}
.chips{border:1px solid var(--bd2);border-radius:8px;min-height:44px;padding:7px 42px 7px 9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;position:relative;background:#fff}
.chip{background:var(--g100);border-radius:6px;padding:4px 9px;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;color:var(--t-btn)}
.chip i{cursor:pointer;color:var(--t3);font-style:normal}
.chips .cv{position:absolute;right:15px;color:var(--t2);font-size:11px}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.qc{background:#fff;border-radius:16px;width:880px;max-width:100%;padding:40px 46px 30px;text-align:center}
.qc h2{font-size:21px;font-weight:700}
.qc .lede2{font-size:14.5px;color:var(--t2);margin-top:7px}
.qc .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px;text-align:left}
.qc .opt{border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.qc .opt.rec{border-color:#9DE7D4}
.qc .oh{padding:20px 22px 17px;border-bottom:1px solid var(--bd)}
.qc .oh .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qc .oh h3{font-size:19px;font-weight:700}
.qc .badge{background:var(--mint);color:var(--brand-dk);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap}
.qc .oh p{font-size:13.5px;color:var(--t2);margin-top:4px}
.qc .ob{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
.qc ul{list-style:none;margin-bottom:20px}
.qc li{display:flex;gap:11px;align-items:flex-start;padding:6px 0;font-size:14px;color:var(--t1)}
.qc li .d{width:14px;height:14px;border-radius:50%;background:var(--g100);flex:none;margin-top:3px}
.qc li .d.on{background:var(--mint);color:var(--brand-ic);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qc li .m{display:block;font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.5}
.qc .go{margin-top:auto;width:100%;padding:12px;border-radius:9px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
.qc .go.out{background:#fff;border:1px solid var(--bd2);color:var(--t-btn)}
.qc .go.grad{border:0;color:#fff;background:var(--grad)}
.qc .fine{font-size:13px;color:var(--t2);margin-top:24px}

.hb{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(16,24,40,.9);color:#fff;border-radius:24px;padding:8px 16px;display:flex;gap:14px;align-items:center;font-size:12px;z-index:20;backdrop-filter:blur(6px)}
.hb b{font-weight:600}
.hb .seg{display:flex;background:rgba(255,255,255,.14);border-radius:14px;overflow:hidden}
.hb .seg button{border:0;background:transparent;color:#fff;font-family:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
.hb .seg button.on{background:var(--brand)}
.hb .lk{border:0;background:rgba(255,255,255,.14);color:#fff;font-family:inherit;font-size:12px;padding:4px 11px;border-radius:14px;cursor:pointer}
.hb .lk:hover{background:rgba(255,255,255,.25)}
.hb .mt{opacity:.7;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div class="rail">
  <div class="logo"><span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span>Agents<br>Only</span></div>
  <div class="sp"></div>
  <div class="gear">&#9881;</div>
  <div class="hr"></div>
  <div class="av">OR</div>
</div>

<div class="stage" id="stage"></div>

<div class="hb">
  <span>Documents</span>
  <span class="seg" id="cnt"><button data-n="1">1</button><button data-n="2">2</button><button data-n="4" class="on">4</button></span>
  <button class="lk" id="resume">Return visit</button>
  <button class="lk" id="reset">Reset</button>
  <span class="mt">Clicks <b id="mClicks">0</b> &middot; Screens <b id="mScreens">1</b></span>
</div>

<script>
var LIB={
 ica:{title:'Independent Contractor Agreement',pages:13,group:'Platform Contracts',mins:4},
 nda:{title:'Confidentiality Agreement',pages:13,group:'Platform Contracts',mins:2},
 arb:{title:'Mutual Arbitration Agreement',pages:13,group:'Country Contracts',optout:true,mins:3},
 ack:{title:'Independent Contractor Status Acknowledgment',pages:2,group:'Country Contracts',mins:1}
};
var SETS={1:['ica'],2:['ica','arb'],4:['ica','nda','arb','ack']};
var S={n:4,docs:[],view:'hub',i:0,page:1,name:'',agreed:false,clicks:0,screens:1};

function build(n,skipReg){
  S.n=n;
  S.docs=SETS[n].map(function(id){var d=LIB[id];
    return{id:id,title:d.title,pages:d.pages,group:d.group,optout:d.optout,mins:d.mins,signed:false,date:null,name:'',agreed:false};});
  var GORDER=['Platform Contracts','Country Contracts'];
  S.docs.sort(function(a,b){
    var g=GORDER.indexOf(a.group)-GORDER.indexOf(b.group);
    return g!==0 ? g : a.title.localeCompare(b.title);
  });
  S.view=(skipReg?(S.docs.length===1?'doc':'hub'):'reg');
  S.i=0;S.page=1;S.name='';S.clicks=0;S.screens=1;
  document.getElementById('mClicks').textContent=0;document.getElementById('mScreens').textContent=1;
  render();
}
function tick(){S.clicks++;document.getElementById('mClicks').textContent=S.clicks;}
function screened(){S.screens++;document.getElementById('mScreens').textContent=S.screens;}
function dots(){return '<span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>';}
function optOutDate(){var d=new Date();d.setDate(d.getDate()+30);return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}
function doneCount(){return S.docs.filter(function(d){return d.signed}).length;}
function nextUnsigned(from){
  for(var k=0;k<S.docs.length;k++){var j=(from+1+k)%S.docs.length;if(!S.docs[j].signed)return j;}
  return -1;
}

var BODY={
 ica:'<h3>CONTRACTOR AGREEMENT</h3>'+
   '<p><b>THIS CONTRACTOR AGREEMENT</b> (the "<b>Agreement</b>") is entered into effective as of <b>2024/09/04</b> (the "<b>Effective Date</b>") between <b>AGENTS ONLY TECHNOLOGIES INC.</b>, a corporation having a registered address at 2900 - 550 Burrard Street, Vancouver, BC, V6C 0A3 ("<b>Agents Only</b>") and <b>Olivia Rhye</b> having an address at <b>605 Dog Hill Lane, Topeka, KS 66603</b> (the "Contractor").</p>'+
   '<h4>WHEREAS:</h4>'+
   '<p>A.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Agents Only carries on business of offering an online technology and software platform for on-demand gigs, including its proprietary GigCX service (the "<b>Platform</b>");</p>'+
   '<p>B.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Contractor has the expertise, qualifications and required certifications to perform the services set out in the attached Appendix "A" (the "<b>Services</b>"); and</p>'+
   '<p>C.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Agents Only wishes to engage Contractor to perform the Services and Contractor agrees to provide the Services to Agents Only on the terms and conditions hereinafter set forth:</p>'+
   '<p><b>NOW THEREFORE THIS AGREEMENT WITNESSES</b> that the parties hereto agree as follows:</p>'+
   '<h4>1.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;TYPE OF SERVICE</h4>'+
   '<p>(a)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;During the Term of this Agreement, Contractor will perform the Services as set out in <u>Appendix "A"</u>.</p>'+
   '<p>(b)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The Services may require Contractor to access and use Agents Only\'s Platform. Access and use thereof shall be subject to the terms and conditions then-in-effect, which are incorporated herein by reference. Such terms and conditions may be amended from time to time by Agents Only according to its terms.</p>'+
   '<h4>2.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;TERM OF AGREEMENT</h4>'+
   '<p>(a)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The term of this Agreement shall begin on the Effective Date and shall continue for a period of one (1) year (the "<b>Term</b>"). The Term shall automatically extend for one (1) year renewal periods unless a party provides at least thirty (30) days\' notice of non-renewal.</p>'+
   '<h4>3.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;INDEPENDENT CONTRACTOR STATUS</h4>',
 nda:'<h3>CONFIDENTIALITY AGREEMENT</h3>'+
   '<p>This Confidentiality Agreement (this "<u>Agreement</u>") is made and entered into as of this _____ day of ____________, by the parties whose signatures appear below (the "<u>Signatories</u>") in connection with the discussions between the Signatories concerning a possible business transaction (the "<u>Proposed Transaction</u>").</p>'+
   '<p>1.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The Signatories have agreed to exchange certain financial, operational and other information concerning their respective businesses (the "<u>Evaluation Materials</u>") and have also agreed that their discussions concerning the Proposed Transaction (the "<u>Discussions</u>") will proceed in strict confidence. The Signatories will proceed with the Discussions with the understanding, and subject to the requirement, that each Signatory will abide by the terms of this Agreement and that any Evaluation Materials which one Signatory (the "<u>Disclosing Party</u>") discloses to the other Signatory (the "<u>Receiving Party</u>") will be held in accordance with the provisions hereof.</p>'+
   '<p>2.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The term Evaluation Materials shall include any notes, analyses, compilations, studies or other documents or records prepared by the Receiving Party which contain or are generated from information supplied by the Disclosing Party in connection with the Discussions. The term Evaluation Materials shall not include, however, any information which is or becomes generally available to the public other than as a result of a disclosure in violation of this Agreement.</p>'+
   '<p>3.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Except as otherwise expressly provided in this Agreement, (a) all Evaluation Materials shall be held in strict confidence by the Receiving Party, and (b) neither Signatory will disclose, or permit any Representative to disclose to any person the fact that Evaluation Materials have been exchanged, that discussions or negotiations concerning the Proposed Transaction are being held, or any of the terms, conditions or other facts with respect to the Proposed Transaction, including the status thereof.</p>',
 arb:'<h3 class="rule">MEDIATION AND ARBITRATION AGREEMENT</h3>'+
   '<p>Our company greatly values its relationships with its contractors. We realize that no matter how hard we may try, an occasional breakdown in the relationship may occur. The purpose of this Mediation and Arbitration Agreement is to help avoid the time, expense and emotions associated with dragging our problems through the litigation system.</p>'+
   '<h4>1.&nbsp;&nbsp;&nbsp;AGREEMENT TO MEDIATE</h4>'+
   '<p>You and the Company agree to first attempt a mediation of any dispute covered by this Agreement. Mediation is a non-binding process allowing the parties to resolve claims without extensive cost, time and emotion. This mediation shall be conducted pursuant to the Rules and Procedures of the American Arbitration Association for the resolution of employment disputes, or as otherwise stipulated by the parties.</p>'+
   '<p>The parties agree to make a good faith effort at mediating any dispute prior to filing a claim for arbitration.</p>'+
   '<h4>2.&nbsp;&nbsp;&nbsp;AGREEMENT TO ARBITRATE; DESIGNATED CLAIMS</h4>'+
   '<p>The parties agree that all references to the "Company" in this Agreement shall include and all of its subsidiary and affiliated entities, including all former, current and future officers, directors and contractors of all such entities. Except as otherwise provided in this Agreement, the Company and the Contractor hereby consent to the resolution by binding arbitration of all claims or controversies for which a federal or state court or other dispute resolution body otherwise would be authorized to grant relief.</p>'+
   '<p>Claims covered by this Agreement include, but are not limited to, claims for compensation due; claims for breach of any contract or covenant, express or implied; tort claims; and claims for violation of any federal, state or other governmental constitution, statute, ordinance or regulation. We both understand and agree that we are entering into this Agreement voluntarily, and that this Agreement provides for the waiver of our respective rights to a trial by jury on the claims covered by this Agreement.</p>'+
   '<h4>3.&nbsp;&nbsp;&nbsp;NEUTRAL MEDIATOR OR ARBITRATOR</h4>'+
   '<p>Any mediation or arbitration of disputes shall be conducted by a neutral mediator/arbitrator.</p>'+
   '<h4>4.&nbsp;&nbsp;&nbsp;GOVERNING LAW</h4>'+
   '<p>All arbitrations covered by this Agreement shall be adjudicated in accordance with the state or federal law that would be applied by a [COUNTRY] sitting at [the place of the hearing].</p>',
 ack:'<h3>INDEPENDENT CONTRACTOR STATUS ACKNOWLEDGMENT</h3>'+
   '<p>By signing below, Contractor acknowledges and agrees to the following:</p>'+
   '<h4>1.&nbsp;&nbsp;&nbsp;NOT AN EMPLOYEE</h4><p>Contractor is engaged as an independent contractor and not as an employee, agent, joint venturer or partner of Agents Only for any purpose.</p>'+
   '<h4>2.&nbsp;&nbsp;&nbsp;TAXES</h4><p>Contractor is solely responsible for all federal, state and local taxes arising from compensation received, and no amounts will be withheld on Contractor\'s behalf.</p>'+
   '<h4>3.&nbsp;&nbsp;&nbsp;NO BENEFITS</h4><p>Contractor is not eligible for benefits offered to employees of Agents Only, including health insurance, paid leave, workers\' compensation or unemployment insurance.</p>'+
   '<h4>4.&nbsp;&nbsp;&nbsp;CONTROL OF WORK</h4><p>Contractor controls the manner and means by which the Services are performed and may accept or decline any gig offered through the Platform.</p>'
};

function paper(d){
  return '<div class="viewer"><div class="page"><div class="plogo">'+dots()+'<span>Agents<br>Only</span></div>'+(BODY[d.id]||'')+'</div></div>';
}
function pager(d){
  var h='<div class="pg"><button '+(S.page===1?'disabled':'')+' onclick="pg(-1)">&#8592; Prev</button>';
  var list=d.pages<=6?Array.apply(null,{length:d.pages}).map(function(_,x){return x+1}):[1,2,3,4,5,'…',d.pages];
  list.forEach(function(p){
    h+= p==='…' ? '<span class="el">…</span>' : '<button class="n '+(p===S.page?'on':'')+'" onclick="goPg('+p+')">'+p+'</button>';
  });
  return h+'<button '+(S.page===d.pages?'disabled':'')+' onclick="pg(1)">Next &#8594;</button></div>';
}

function hub(){
  var n=S.docs.length;
  var h='<div class="card"><div class="col">';
  h+='<div class="hdr"><h1>Sign your documents</h1><span class="pill-g">'+doneCount()+' of '+n+' complete</span></div>';
  h+='<p class="lede">'+n+' documents required for contractors in the United States. Your progress is saved.</p>';

  function row(d,idx){
    var r='<div class="row">';
    r+= d.signed ? '<span class="ic on">&#10003;</span>' : '<span class="ic"><span class="ring"></span></span>';
    r+='<span class="nm">'+d.title+(d.optout?'<span class="tag">30-day opt-out</span>':'')+'</span>';
    r+='<span class="rt">'+(d.signed
          ? '<a class="view" onclick="open_('+idx+')">View</a>'
          : '<button class="sign" onclick="open_('+idx+')">Sign</button>')+'</span>';
    return r+'</div>';
  }

  var groups=[];
  S.docs.forEach(function(d){if(groups.indexOf(d.group)<0)groups.push(d.group);});
  groups.forEach(function(g){
    h+='<div class="grp">'+g+'</div><div class="list">';
    S.docs.forEach(function(d,idx){if(d.group===g)h+=row(d,idx);});
    h+='</div>';
  });

  var all=S.docs.every(function(d){return d.signed});
  h+='<div class="divider"></div><div class="foot"><button class="btn sec" onclick="toReg()">Back</button>'+
     '<button class="btn pri" '+(all?'':'disabled')+' onclick="finish()">Complete</button></div>';
  return h+'</div></div>';
}

function docView(){
  var d=S.docs[S.i], n=S.docs.length, nx=nextUnsigned(S.i), single=(n===1);
  var h='<div class="card"><div class="col">';
  if(!single) h+='<div class="crumb"><a onclick="toHub()">&#8592; All documents</a><span class="pill-g">'+(S.i+1)+' of '+n+'</span></div>';
  h+='<h1 class="doct"'+(single?'':' style="margin-top:18px"')+'>'+d.title+'</h1>';
  if(nx>=0&&nx!==S.i) h+='<div class="sub">Next: '+S.docs[nx].title+'</div>';
  h+=paper(d)+pager(d);
  h+='<div class="inset">';
  if(d.optout){
    h+='<div class="notice"><span class="ico">&#9432;</span><div><div class="h">You can opt out of arbitration</div>'+
       '<div class="b">Signing does not lock you in. You have 30 days from today &mdash; until <b>'+optOutDate()+'</b> &mdash; to opt out by emailing arbitrationoptout@agentsonly.com. Opting out will not affect your contract, your pay, or your access to gigs.</div></div></div>';
  }
  h+='<div class="sig"><h2>Contractor Signature</h2><label class="lb">Full name</label>'+
     '<input type="text" value="'+d.name+'" placeholder="Olivia O.J Rhye" oninput="setName(this.value)">'+
     '<label class="chk"><input type="checkbox" '+(d.agreed?'checked':'')+' onchange="setAgree(this.checked)"><span>I have read and accepted the '+d.title+'.</span></label></div>';
  var lbl=single?'Complete':((nx>=0&&nx!==S.i)?'Sign and continue':'Done');
  h+='<div class="divider"></div><div class="foot">'+
     (single?'<button class="btn sec" onclick="toReg()">Back</button>'
            :'<button class="btn sec" onclick="toHub()">Cancel</button>')+
     '<button class="btn pri" '+(ok()?'':'disabled')+' onclick="sign()">'+lbl+'</button></div>';
  return h+'</div></div></div>';
}
function ok(){var d=S.docs[S.i];return d.name.trim().length>1&&d.agreed;}

var REG=['Personal Info','Identity Verification','Document Upload','Work Experience','Qualifications & Skills','Project Preference'];
function radios(name,items,sel){
  var h='';
  items.forEach(function(t,i){
    h+='<label class="opt2"><input type="radio" name="'+name+'" '+(i===sel?'checked':'')+' onclick="tick()"><span>'+t+'</span></label>';
  });
  return h;
}
function regScreen(){
  var h='<div class="card rc"><div class="reg"><div class="nav">';
  REG.forEach(function(s,i){
    var now=i===REG.length-1;
    h+='<div class="step'+(now?' now':'')+'">'+(i<REG.length-1?'<span class="ln"></span>':'')+
       '<span class="cir">'+(now?(i+1):'&#10003;')+'</span><span class="lb2">'+s+'</span></div>';
  });
  h+='</div><div class="form"><h1>Project Preference</h1>';

  h+='<div class="q first">What is your current state of employment?</div>'+
     radios('emp',['Full-time','Part-time','Freelance','Unemployed'],1);

  h+='<div class="q">How many Gig hours do you plan to work in a week?</div>'+
     radios('hrs',['Less than 10 hours','10 - 20 hours','20 - 30 hours','30 - 40 hours','More than 40 hours'],2);

  h+='<div class="q">Which days of the week are you available to work? Select all that apply.</div>'+
     '<label class="opt2"><input type="checkbox" checked onclick="tick()"><span>Weekdays</span></label>'+
     '<label class="opt2"><input type="checkbox" onclick="tick()"><span>Weekends</span></label>';

  h+='<div class="q">Select your preferred contact type(s)</div>'+
     radios('ct',['Inbound','Outbound','Both'],2);

  h+='<div class="hint">Brands or companies previously affiliated with (separate multiple entries with commas)</div>'+
     '<input type="text" value="Google, Microsoft, Zara, H&amp;M">';

  h+='<div class="hint">Select your hobbies</div>'+
     '<div class="chips"><span class="chip">Photography <i onclick="tick()">&#10005;</i></span>'+
     '<span class="chip">Cooking <i onclick="tick()">&#10005;</i></span><span class="cv">&#9660;</span></div>';

  h+='<div class="divider"></div><div class="foot" style="justify-content:flex-end">'+
     '<button class="btn pri" onclick="submit_()">Submit</button></div>';
  return h+'</div></div></div>';
}

function quickCheck(){
  return '<div class="modal"><div class="qc"><h2>Quick Check</h2>'+
  '<p class="lede2">Choose how you want to continue with your account setup. Pick the option that works best for you.</p>'+
  '<div class="grid">'+
    '<div class="opt"><div class="oh"><div class="r"><h3>Full Setup</h3></div><p>Complete all verifications now</p></div>'+
    '<div class="ob"><ul>'+
      '<li><span class="d"></span><span>Background check consent</span></li>'+
      '<li><span class="d"></span><span>Typing test</span></li>'+
      '<li><span class="d"></span><span>Voice recording upload</span></li>'+
      '<li><span class="d"></span><span>Internet speed &amp; security check</span></li>'+
      '<li><span class="d on">&#10003;</span><span><b>Unlocks all projects</b></span></li>'+
    '</ul><button class="go out" onclick="tick()">Complete full setup</button></div></div>'+
    '<div class="opt rec"><div class="oh"><div class="r"><h3>Basic Setup</h3><span class="badge">Recommended</span></div><p>Get started faster, finish later</p></div>'+
    '<div class="ob"><ul>'+
      '<li><span class="d"></span><span>Skip background check</span></li>'+
      '<li><span class="d"></span><span>Skip tests &amp; recording</span></li>'+
      '<li><span class="d on">&#10003;</span><span><b>Start faster</b><span class="m">Most projects will remain hidden until you complete full setup.</span></span></li>'+
    '</ul><button class="go grad" onclick="tick()">Basic setup for now</button></div></div>'+
  '</div><p class="fine">You can always complete the full verification later from your profile settings.</p></div></div>';
}

function render(){
  var b = S.view==='reg' ? regScreen()
        : (S.view==='hub' ? hub() : (S.view==='doc' ? docView() : quickCheck()));
  document.getElementById('stage').innerHTML=b;
}
function open_(i){tick();S.i=i;S.page=1;if(!S.docs[i].name)S.docs[i].name=S.name;S.view='doc';screened();render();window.scrollTo({top:0});}
function toHub(){tick();S.view='hub';screened();render();window.scrollTo({top:0});}
function toReg(){tick();S.view='reg';screened();render();window.scrollTo({top:0});}
function submit_(){tick();S.view=(S.docs.length===1?'doc':'hub');screened();render();window.scrollTo({top:0});}
function setName(v){S.docs[S.i].name=v;S.name=v;document.querySelector('.foot .pri').disabled=!ok();}
function setAgree(v){
  tick();var d=S.docs[S.i];d.agreed=v;
  if(!v&&d.signed){d.signed=false;d.date=null;render();return;}
  document.querySelector('.foot .pri').disabled=!ok();
}
function pg(x){tick();S.page=Math.min(Math.max(1,S.page+x),S.docs[S.i].pages);render();}
function goPg(p){tick();S.page=p;render();}
function sign(){
  tick();
  S.docs[S.i].signed=true;S.docs[S.i].date='19 Aug';
  var nx=nextUnsigned(S.i);
  if(S.docs.length===1){S.view='qc';}
  else if(nx>=0){S.i=nx;S.page=1;if(!S.docs[nx].name)S.docs[nx].name=S.name;S.view='doc';}
  else{S.view='hub';}
  screened();render();window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){tick();S.view='qc';screened();render();window.scrollTo({top:0});}
document.getElementById('resume').onclick=function(){
  build(S.n);
  S.docs[0].signed=true;S.docs[0].date='12 Aug';
  S.docs[0].name='Olivia O.J Rhye';S.docs[0].agreed=true;
  S.name='Olivia O.J Rhye';S.view=(S.docs.length===1?'doc':'hub');S.i=0;render();
};
document.getElementById('reset').onclick=function(){build(S.n);};
document.querySelectorAll('#cnt button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#cnt button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');build(+b.dataset.n,true);
  };
});
build(4);
</script>
</body>
</html>
