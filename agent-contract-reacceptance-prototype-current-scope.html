<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Portal — project contract re-acceptance (current scope)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{
  --ink:#16263c; --ink2:#4a5a71; --ink3:#78879a;
  --panel:#fff; --line:#e8eef1; --line2:#dbe4ea;
  --teal:#0a9d78; --teal-d:#087c5f; --teal-s:#e6f7f0; --teal-ink:#0a7358;
  --amber:#a85a08; --amber-s:#fdf4e7; --amber-line:#f2dcb6;
  --red:#c53b3b; --red-s:#fdf1f1;
  --od:#c2620a; --od-s:#fdf0e0;          /* overdue — always orange, never red */
  --rail-on:#e2f6ee;
  --sh:0 1px 2px rgba(16,30,50,.05);
  --sh-md:0 4px 16px rgba(16,30,50,.08);
  --sh-lg:0 18px 50px rgba(16,30,50,.18),0 3px 8px rgba(16,30,50,.06);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
  background:linear-gradient(160deg,#e6f1f4 0%,#eef5f7 30%,#f6f9fa 70%);
  background-attachment:fixed;min-height:100vh;
  font:14.5px/1.55 var(--font);
  -webkit-font-smoothing:antialiased}
/* One family for the whole prototype, including form controls, which otherwise
   fall back to the OS UI font. */
button,input,select,textarea,optgroup{font-family:var(--font)}
button{font-size:inherit;cursor:pointer}
input,select{font-size:inherit;color:var(--ink)}
a{color:var(--teal);text-decoration:none}

.app{min-height:100vh}

/* ---------- left nav: matches the Figma "Sidebar navigation – Slim" spec ----------
   82px at rest, 232px on hover. The 82px column stays reserved, so the expanded panel
   overlays the page instead of shoving it sideways. */
.rail{position:fixed;left:0;top:0;bottom:0;width:82px;background:#fff;border-right:1px solid #E4E7EC;
  z-index:80;overflow:hidden;transition:width .18s ease}
.rail:is(:hover,.pin){width:232px;box-shadow:0 12px 26px -8px rgba(16,24,40,.13)}
.railin{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-top:32px}
.rnav{display:flex;flex-direction:column;gap:24px}
.rlogo{display:flex;align-items:center;gap:9px;padding:0 16px 12px;justify-content:center}
.rail:is(:hover,.pin) .rlogo{justify-content:flex-start;padding-left:24px;padding-right:20px}
.mark{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;flex-shrink:0}
.mark i{display:block;border-radius:50%;background:#00D0A3}
/* display:none, not opacity:0 — an invisible label still occupies width, which pushed the
   logo mark off the icon centre line. */
.word{font-size:14px;font-weight:700;line-height:1.05;color:#101828;white-space:nowrap;letter-spacing:-.01em;
  display:none}
.rail:is(:hover,.pin) .word{display:block}
.rgroup{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.rgroup.tight{gap:4px}
.ritem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;background:#fff;
  border:0;width:100%;color:#667085;white-space:nowrap;text-align:left}
.ritem svg{width:24px;height:24px;flex-shrink:0}
.ritem b{font-size:16px;font-weight:500;color:#344054;opacity:0;transition:opacity .14s}
.rail:is(:hover,.pin) .ritem b{opacity:1}
.ritem:hover{background:#F4FDFA}
.ritem.on{background:#E9FEF9;color:#007460}
.ritem.on b{color:#00574F}
.rfoot{display:flex;flex-direction:column;gap:24px;padding-bottom:28px}
.rdiv{height:1px;background:#E4E7EC;margin:0 16px}
/* 16px puts the 48px avatar's centre on the same 40px axis as the 24px nav icons. */
/* Decoration only — the account menu is opened from the Settings item. */
.racct{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;cursor:default}
.rail:is(:hover,.pin) .racct{padding:0 8px}
.rav{width:48px;height:48px;border-radius:50%;flex-shrink:0;border:1px solid #E4E7EC;
  background:#dfe7ed url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2398a9b8"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6z"/></svg>') center/30px no-repeat}
.racct b{font-size:14px;line-height:20px;font-weight:500;color:#101828;white-space:nowrap;
  opacity:0;transition:opacity .14s}
.rail:is(:hover,.pin) .racct b{opacity:1}

/* account submenu — floats clear of the rail so it works in either width */
.rsub{position:fixed;z-index:95;background:#fff;border-radius:8px;padding:8px;display:flex;
  flex-direction:column;gap:4px;min-width:214px;
  box-shadow:0 4px 6px -2px rgba(16,24,40,.05),0 12px 16px -4px rgba(16,24,40,.10)}
.rsub .ritem b{opacity:1}
.rsub .ritem.danger{color:#F97066}
.rsub .ritem.danger b{color:#F04438}

/* ---------- main ---------- */
.main{padding:30px 34px 90px;min-width:0;margin-left:82px}
.wrap{max-width:1180px;margin:0 auto}
h1.hi{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:0 0 20px}

.toprow{display:grid;grid-template-columns:376px minmax(0,1fr);gap:20px;margin-bottom:34px;align-items:start}
@media(max-width:980px){.toprow{grid-template-columns:1fr}}

/* ---------- setup guide: a small persistent card, not a page block ----------
   Anchored bottom-right so it never competes with the page for the top of the screen,
   and so it can appear or disappear without the layout moving underneath it. */
.guide{position:fixed;right:20px;bottom:76px;z-index:60;width:300px;background:#fff;border-radius:16px;
  padding:13px 13px 11px;border:1px solid rgba(10,157,120,.18);
  box-shadow:0 14px 36px rgba(16,30,50,.17),0 2px 6px rgba(16,30,50,.06)}
.ghead{display:flex;align-items:center;gap:8px}
.ghead h2{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;white-space:nowrap}
.gcount{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;background:#F2F4F7;
  color:#344054;white-space:nowrap}
.gtog{border:0;background:transparent;color:var(--ink3);padding:3px;border-radius:6px;display:grid;place-items:center}
.gtog:hover{background:#f1f5f7;color:var(--ink2)}
.gtog svg{width:15px;height:15px;transition:transform .18s}
.guide.col .gtog svg{transform:rotate(180deg)}
.gbar{height:5px;border-radius:99px;background:#eef2f5;overflow:hidden;margin:11px 0 9px}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f46e5,#6366f1);transition:width .4s}
.glist{background:#f8fafb;border:1px solid var(--line);border-radius:11px;padding:4px;margin-top:10px}
/* The whole row is the target, so there is no separate Open button competing with the
   label for horizontal space — which is what forced the text onto a third line. */
.gitem{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-radius:9px;width:100%;
  text-align:left;border:1px solid transparent;background:transparent;color:inherit;font:inherit}
.gitem+.gitem{margin-top:2px}
.gitem.act{cursor:pointer}
.gitem.act:hover{background:#eef2f5}
.gitem .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  border:1.8px solid var(--teal);background:#fff;margin-top:2px}
.gitem .dot svg{width:9px;height:9px;color:#fff}
.gitem.done .dot{background:var(--teal);border-color:var(--teal)}
/* Label and its deadline stack, so the label gets the card's full width for 1–2 lines. */
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.gitem .lbl{font-size:13.5px;font-weight:400;line-height:1.4}
.gitem.done .lbl{color:var(--ink2)}
/* Every row looks the same, in both widgets. The deadline badge carries the urgency, so the
   row itself does not need to shout as well. */
/* Filled only — no outlined badges in the design system. multiply is a no-op on white. */
.due{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;
  background:#F2F4F7;color:#344054;mix-blend-mode:multiply}
.due.late{background:var(--od-s);color:var(--od)}
.gfoot{font-size:12px;color:var(--ink3);padding:10px 3px 1px;line-height:1.45}
.guide.col{width:auto;padding:9px 11px}
.guide.col .gbar,.guide.col .glist,.guide.col .gfoot{display:none}
.allset{position:fixed;right:20px;bottom:76px;z-index:60;background:#fff;border-radius:99px;
  padding:9px 15px 9px 11px;display:flex;gap:9px;align-items:center;font-size:13px;
  border:1px solid rgba(10,157,120,.18);box-shadow:0 10px 28px rgba(16,30,50,.14)}
.allset .tick{width:20px;height:20px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex-shrink:0}

/* ---------- tier card ---------- */
.tier{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--sh-md);min-height:150px;
  display:flex;flex-direction:column;justify-content:center}
.tier .badge{display:inline-flex;align-items:center;gap:7px;background:#14273d;color:#fff;font-size:12.5px;
  font-weight:700;padding:6px 13px;border-radius:99px;width:fit-content;margin-bottom:11px}
.tier p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.tier p b{color:var(--ink)}

/* ---------- hero banner ---------- */
.hero{border-radius:18px;padding:26px 28px;min-height:150px;
  background:linear-gradient(115deg,#f4e7fb 0%,#e9e7fd 45%,#dfe9fd 100%);
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh)}
.hero h3{margin:0 0 5px;font-size:24px;font-weight:700;color:#4338ca;letter-spacing:-.02em}
.hero p{margin:0;font-size:14.5px;color:#5b5f86;max-width:44ch}

/* ---------- projects ---------- */
.psec h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.psechead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.psechead .sp{flex:1}
.segs{display:flex;gap:4px;background:#fff;border-radius:11px;padding:4px;box-shadow:var(--sh)}
.seg{border:0;background:transparent;padding:8px 15px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink3)}
.seg:hover{color:var(--ink2)}
.seg.on{background:var(--teal-s);color:var(--teal-ink)}

.pcard{background:#fff;border-radius:18px;padding:24px 26px 26px;box-shadow:var(--sh-md)}
.pcardhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pcardhead b{font-size:19px;font-weight:700;letter-spacing:-.015em}
.pcardhead .ct{font-size:16px;color:var(--ink2);font-weight:500}
.pcardhead .dash{font-size:15px;color:var(--ink3)}
.pcardhead .sp{flex:1}
.sortwrap{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);white-space:nowrap}
.sortwrap select{padding:9px 34px 9px 13px;border:1px solid var(--line2);border-radius:11px;background:#fff;
  font-size:14px;font-weight:500;appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%234a5a71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;background-position:right 11px center;background-size:14px}
.sortwrap select:focus{outline:2px solid var(--teal-s);border-color:var(--teal)}

.subtabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:18px 0 22px}
.subtab{border:0;background:transparent;padding:0 0 12px;font-size:14.5px;font-weight:600;color:var(--ink3);
  border-bottom:2.5px solid transparent;margin-bottom:-1px}
.subtab:hover{color:var(--ink2)}
.subtab.on{color:var(--teal-ink);border-bottom-color:var(--teal)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:22px}
.proj{border:1px solid #eef2f5;border-radius:14px;overflow:hidden;background:#f7f9fb;text-align:left;
  padding:0;width:100%;transition:.14s}
/* Lift only. Recolouring the card on hover read as a state change rather than a pointer cue. */
.proj:hover{box-shadow:0 6px 20px rgba(16,30,50,.11)}
.projtop{display:flex;align-items:flex-start;gap:11px;padding:16px 16px 14px}
.projtop .ic{width:28px;height:28px;border-radius:50%;background:#3d4c60;color:#fff;display:grid;
  place-items:center;flex-shrink:0;margin-top:1px}
.projtop .ic svg{width:15px;height:15px}
.projtop b{flex:1;font-size:15.5px;font-weight:700;line-height:1.32}
.projtop .car{color:var(--ink3);font-size:17px;line-height:1;margin-top:4px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid #e6ecf0;font-size:13.5px}
.prow .k{color:var(--ink2)}
.prow .v{font-weight:600;text-align:right;white-space:nowrap}
.stars{color:#f0b429;letter-spacing:1.5px;font-size:12px}
.stars .dim{color:#dbe2e8}
.flags{font-size:13px;font-weight:500}

.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.pgb{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:9px 18px;font-size:14px;
  font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.pgb:hover:not(:disabled){background:#f5f8f9}
.pgb:disabled{color:#c6ced6;cursor:not-allowed}
.pgn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:14px;
  font-weight:600;color:var(--ink2)}
.pgn:hover{background:#f2f5f8}
.pgn.on{background:var(--teal-s);color:var(--teal-ink)}
.pempty{padding:44px 16px;text-align:center;color:var(--ink3);font-size:14px}
.worknow{display:flex;align-items:center;gap:14px;border:1px solid #bfe6d7;background:var(--teal-s);
  border-radius:12px;padding:15px 18px}
.worknow b{font-size:15px}
.worknow .meta{font-size:13px;color:var(--teal-ink);margin-top:2px}
.worknow .sp{flex:1}
.workclean{font-size:12.5px;color:var(--ink3);margin:16px 2px 0;max-width:70ch}
.workfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);
  margin-top:22px;padding-top:20px}

.notice{margin-bottom:20px;background:var(--teal-s);border:1px solid #bfe6d7;border-radius:11px;
  padding:12px 15px;font-size:13.5px;color:var(--teal-ink);display:flex;gap:9px;align-items:flex-start}
.notice svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}

/* ---------- settings / legal ---------- */
.sheet{background:#fff;border-radius:20px;padding:30px 34px 40px;box-shadow:var(--sh-md)}
.sheet h1{font-size:26px;font-weight:700;margin:0 0 22px;letter-spacing:-.02em}
.setgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:0}
@media(max-width:840px){.setgrid{grid-template-columns:1fr}}
.setnav{border-right:1px solid var(--line);padding-right:18px;display:flex;flex-direction:column;gap:2px}
.setnav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;
  font-size:14.5px;color:var(--ink2);display:flex;align-items:center}
.setnav button:hover{background:#f4f7f9;color:var(--ink)}
.setnav button.on{background:var(--teal-s);color:var(--teal-ink);font-weight:600}
.setbody{padding-left:28px}
.setbody h2{font-size:20px;font-weight:700;margin:0 0 22px;letter-spacing:-.015em}
.setbody h3{font-size:16.5px;font-weight:700;margin:0 0 13px}
.docgroup{margin-bottom:30px}
/* Renamed from .proj — it collided with the project-card selector, so hovering this group
   picked up the card's lift. */
/* One light card per project, so the grey does the separating. */
.projgrp{background:#f7f9fb;border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;
  margin-bottom:14px}
.projgrp:last-child{margin-bottom:0}
.projgrp-nm{font-size:14.5px;font-weight:700;margin-bottom:12px}
.projgrp .docrow{margin-bottom:10px}
.projgrp .prev{margin:-2px 0 12px 2px}
.docrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:11px;
  padding:13px 16px;margin-bottom:11px;background:#fff}
.docrow.act{border-color:#bfe3d6}
.docrow .nm{flex:1;min-width:0}
.docrow .nm b{display:block;font-size:14.5px;font-weight:600}
.docrow .meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.tag{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap}
.tag.need{background:var(--amber-s);color:var(--amber)}
.tag.ok{background:var(--teal-s);color:var(--teal-ink)}
/* Once signed, the useful fact is when — not that it happened. Same pill metrics as the
   "Needs signature" tag, so signed and unsigned rows line up. */
.signedon{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
  color:#00574F;background:#E9FEF9;border-radius:99px;padding:5px 13px;
  white-space:nowrap;flex-shrink:0}
.signedon svg{width:12px;height:12px;flex:none;color:#0BB98A}
.tag.miss{background:var(--amber-s);color:var(--amber)}
.docrow .sign{border:1px solid var(--teal);background:#fff;color:var(--teal-ink);font-weight:600;
  font-size:13px;padding:7px 13px;border-radius:8px}
.docrow .sign:hover{background:var(--teal-s)}
/* the whole tile is the target now, so there is no button inside it */
.docrow.clickable{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;transition:.13s}
.docrow.clickable:hover{border-color:#bfe3d6;background:#f7fdfb;box-shadow:0 3px 10px rgba(10,157,120,.08)}

/* "Incomplete section" hint on the Legal nav item */
.ihint{position:relative;display:grid;place-items:center;width:17px;height:17px;border-radius:50%;
  border:1.5px solid #96a7b6;color:#5d7183;font-size:10.5px;font-weight:700;margin-left:8px;
  flex-shrink:0;cursor:help}
.ihint .tip{position:absolute;left:calc(100% + 11px);top:50%;transform:translateY(-50%);
  background:#14273d;color:#fff;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:10px;
  white-space:nowrap;opacity:0;visibility:hidden;transition:.12s;z-index:120;
  box-shadow:0 8px 22px rgba(16,30,50,.22)}
.ihint .tip::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:7px solid transparent;border-right-color:#14273d}
.ihint:hover .tip,.ihint:focus-visible .tip{opacity:1;visibility:visible}

/* ---------- document view (sign / review) ---------- */
.docview h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 24px}
.backlink{border:0;background:transparent;color:var(--teal);font-weight:600;font-size:13.5px;padding:0;
  display:inline-flex;align-items:center;gap:7px;margin-bottom:14px}
.backlink:hover{text-decoration:underline}
.backlink svg{width:15px;height:15px}
.paperframe{border:1px solid #e4eaef;padding:8px;background:#fdfefe;border-radius:3px}
.paperpg{background:#fff;border:1px solid #eef2f5;padding:42px 52px 56px;min-height:600px}
.paperpg .aologo{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:30px}
.paperpg .aologo .mark{width:26px;height:26px;opacity:1}
.paperpg .aologo b{font-size:16px;font-weight:700;line-height:1.05;color:#14273d;letter-spacing:-.01em}
.paperpg h5{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.03em;margin:0 0 30px}
.paperpg p{font-size:11.8px;line-height:1.66;margin:0 0 10px;text-align:justify;color:#1d2b3d}
.paperpg .cl{font-weight:700;margin:16px 0 8px;text-align:left}
.paperpg .ind{padding-left:46px;text-indent:-46px}
.paperpg u{text-decoration:underline}

.sigsec{margin-top:32px}
.sigsec h3{font-size:17.5px;font-weight:600;margin:0 0 18px;letter-spacing:-.01em}
.fld label{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
.fld input{width:100%;padding:13px 15px;border:1px solid var(--line2);border-radius:10px;font-size:15px}
.fld input:focus{outline:2px solid var(--teal-s);border-color:var(--teal)}
.fld input:disabled{background:#f7f9fb;color:var(--ink3);cursor:default}
.chkrow{display:flex;align-items:flex-start;gap:11px;margin-top:22px;font-size:15px}
.chkrow input{width:17px;height:17px;accent-color:var(--teal);margin-top:3px;flex-shrink:0}
.chkrow label{cursor:pointer}
.chkrow input:disabled+label{color:var(--ink2);cursor:default}
.sigdiv{height:1px;background:var(--line);margin:26px 0 22px}
.sigfoot{display:flex;justify-content:flex-end}
.btn.sq{border-radius:9px;padding:13px 30px}
.verchip{display:inline-block;font-size:12.5px;font-weight:500;padding:4px 11px;border-radius:99px;
  background:#F2F4F7;color:#344054;margin-left:12px;vertical-align:3px}

   ============================================================ */
const TODAY = new Date('2026-09-08T00:00:00Z');   // UTC so addDays never drifts a day
const fmt = iso => {
  const [y,m,d] = iso.split('-').map(Number);
  return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+y;
};
const addDays = (base,n) => new Date(base.getTime()+n*86400000).toISOString().slice(0,10);

/* CURRENT SCOPE
   ----------------------------------------------------------------------------------
   Client-issued project contracts only. When a client re-issues one, the agent already
   on that project has to accept the new version.

   Out of scope here, and shown in the other prototype: the platform Independent
   Contractor Agreement, and anything specific to a brand-new agent's onboarding.

   Nothing in this scope blocks work or blocks applying. It is reminders in three places:
   the Action required widget, the ongoing project's modal, and Settings → Legal.
*/
const S = {
  due:'p1', state:'grace', bankTax:true,
  view:'home', tab:'available', sub:'joined', sort:'new', page:1,
  docs:{sow:false,nda:false}, applied:[], openKind:'available',

};

/* Client contracts get a platform-set review window rather than a per-client date. */
const PDOC_WINDOW = 14;
const pdocDue      = d => d.due;
const pdocDaysLeft = d => Math.round((new Date(d.due+'T00:00:00Z') - TODAY)/86400000);
const pdocLabel    = d => { const n=pdocDaysLeft(d);
  return n<0 ? 'Overdue' : n+(n===1?' day left':' days left'); };
const pdocSub      = d => (pdocDaysLeft(d)<0 ? 'Was due ' : 'Due ')+fmt(pdocDue(d));
const PREV_INLINE   = 3;
const YEAR_GROUP_AT = 10;

/* Project contracts the agent has already accepted at some version. rv-sow and qa-dha are
   the two the client has re-issued; the Due / State controls decide which are outstanding
   and whether they are still inside their window. */
/* Read-only in this release: signed once, never re-issued. They are viewable so the agent
   can go back and read what they agreed to — the same reason the project ones are. */
const PLATFORMDOCS = [
  {id:'ica', project:null, title:'Independent Contractor Agreement', version:1,
   effective:'2025-02-01', pages:6, signed:true, signedOn:'2025-02-03', previous:[]},
  {id:'bgc', project:null, title:'Background Check Consent & Criminal History Declaration',
   version:1, effective:'2025-02-01', pages:3, signed:true, signedOn:'2025-02-03', previous:[]}

let PROJECTDOCS = [
  {id:'im-ca',  project:'Image Moderation',  title:'Consulting Agreement', version:1,
   effective:'2025-03-04', due:'2025-03-18', pages:3, signed:true, signedOn:'2025-03-06', previous:[]},
  {id:'im-tou', project:'Image Moderation',  title:'Terms of Use', version:1,
   effective:'2025-03-04', due:'2025-03-18', pages:3, signed:true, signedOn:'2025-03-06', previous:[]},

   effective:'2024-11-18', due:'2024-12-02', pages:3, signed:true, signedOn:'2024-11-20', previous:[]},
  {id:'pz-sow', project:'Large Pizza Project', title:'Statement of Work', version:1,
   effective:'2024-11-18', due:'2024-12-02', pages:4, signed:true, signedOn:'2024-11-20', previous:[]},
  {id:'rv-nda', project:'RV Rental Platform', title:'Project NDA', version:1,
   effective:'2025-06-10', due:'2025-06-24', pages:3, signed:true, signedOn:'2025-06-12', previous:[]},
  {id:'rv-sow', project:'RV Rental Platform', title:'Statement of Work', version:2,
   effective:'2026-09-02', due:'2026-09-16', pages:4, signed:false,
   previous:[{v:1, effective:'2025-06-10', signed:'2025-06-12'}]},
  {id:'qa-dha', project:'Quality Assurance', title:'Data Handling Addendum', version:2,
   effective:'2026-09-01', due:'2026-09-15', pages:3, signed:false,
   previous:[{v:1, effective:'2025-01-20', signed:'2025-01-22'}]}
];

/* Only one account-level prerequisite is left in scope, and it is pre-existing behaviour. */
function requirements(){
  const out = [];
  if(!S.bankTax) out.push({
    key:'bt', hard:true,
    label:'Add your bank & tax information',
    sub:'Needed before you can be paid',
    scope:'all', cta:'Add bank & tax information',
    note:'Finish your bank & tax info before applying.',
    act:"toast('Would open Settings → Bank Details')"
  });
  return out;
}

/* Applying is the ONLY hard gate. It is one well-defined door, it is discretionary, and it
   risks no existing income. Working is reached through many doors — the dashboard project
   switcher, Handle Contacts Now, task claim, deep links — so gating it would be both leaky
   and, for a contractor paid per task, a block on that day's earnings.
   Everything outstanding for a project is surfaced as a reminder instead. */
function outstandingFor(projectName){
  /* Bank & tax has no deadline, so it is never "late" — only a client contract can be. */
  const out = requirements().map(r => Object.assign({}, r, {late:false}));
  PROJECTDOCS.filter(d=>d.project===projectName && !d.signed).forEach(d=>out.push({
    key:d.id, scope:'project', late:pdocDaysLeft(d)<0,
    label:d.title+' V'+d.version,
    badge:pdocLabel(d), sub:pdocSub(d),
    cta:'Review & sign', act:"openLegalDoc('"+d.id+"')"
  }));
  return out;
}
const canApply = () => !requirements().some(r=>r.hard);

/* ============================================================
   DATA
   ============================================================ */

  {id:'p1', name:'Short Project Name',                        type:'Data Labelling', stars:3.6, exp:'<3 years', skills:'Comprehension, Logic'},
  {id:'p2', name:'Long Project Name Inbound Service Desk for Acme Co.', type:'Outbound', stars:4.1, exp:'<3 years', skills:'Voice, Typing'},

];

  {id:'j2', name:'Long Project Name Inbound Service Desk for Acme Co.', type:'Outbound', stars:3.6, exp:'<3 years'},

  {id:'j4', name:'Inquiry Resolution for XYZ Banking Services', type:'Outbound', stars:3.6, exp:'<3 years'},

const PENDING = [

  {id:'q2', name:'Appointment Setting for Dental Group',         type:'Outbound', stars:3.7, exp:'<3 years'}

const DOCS = {
  sow:{title:'Statement of Work', scope:'project', project:'RV Rental Platform',
       body:`<h5>Statement of Work — RV Rental Platform</h5>
       <p>This Statement of Work describes the services to be delivered under the RV Rental Platform project and supplements any agreement already in force between the parties.</p>
       <b class="cl">Scope</b><p>Inbound customer support for rental bookings, cancellations and damage claims, delivered during the scheduled shifts the Contractor books through the platform.</p>
       <b class="cl">Service levels</b><p>Contractor will maintain an average handling quality score of 3.5 or above across any rolling thirty-day period.</p>
       <b class="cl">Client-specific tooling</b><p>Contractor agrees to complete the client's booking-system training module before taking live contacts.</p>`},
  nda:{title:'Project NDA', scope:'project', project:'RV Rental Platform',
       body:`<h5>Project Non-Disclosure Agreement</h5>
       <p>This Agreement applies to confidential information disclosed in connection with the RV Rental Platform project only.</p>
       <b class="cl">1. Confidential information</b><p>Includes customer records, booking data, pricing, and any material marked confidential or that a reasonable person would understand to be confidential.</p>
       <b class="cl">2. Obligations</b><p>Contractor shall use confidential information solely to perform the services and shall not disclose it to any third party.</p>
       <b class="cl">3. Duration</b><p>Obligations survive for three (3) years following the end of the Contractor's participation in the project.</p>`}
};

/* ============================================================
   HOME
   ============================================================ */
function projectDocItems(){
  const due = PROJECTDOCS.filter(d=>!d.signed);
  if(!due.length) return [];
  if(due.length===1) return [{done:false, late:pdocDaysLeft(due[0])<0,
    lbl:'Sign '+due[0].title+' V'+due[0].version+' — '+due[0].project,
    due:pdocLabel(due[0]),
    act:"openLegalDoc('"+due[0].id+"')"}];
  const projects=[...new Set(due.map(d=>d.project))].length;
  /* Grouped, so the badge reports the most pressing of them. */
  const soonest = due.reduce((a,b)=>pdocDaysLeft(b)<pdocDaysLeft(a)?b:a);
  return [{done:false, late:pdocDaysLeft(soonest)<0,
    lbl:'Sign '+due.length+' project contracts across '+projects+' projects',
    due:pdocLabel(soonest),
    act:"go('legal')"}];
}
/* Existing agent only: the widget carries whatever is outstanding. Bank & tax leads, since
   it gates getting paid; the client contracts follow. Neither has a deadline of its own, so
   only the contract rows carry a badge. */
function guideItems(){

    items.push({done:false, lbl:'Add bank details', act:"toast('Would open Settings → Bank Details')"});

function oldRow(p, key){

function toggleHist(key){
  /* Keyed, not a single slot — opening one document's history must not close another's. */
  S.histOpen = Object.assign({}, S.histOpen, {[key]: !S.histOpen[key]});

/* One disclosure per document — the platform agreement and every project document that has
   been re-issued all use it. */
function historyBlock(key){
  const c = docCtx(key);
  if(!c.previous.length) return '';
  const open = !!S.histOpen[key];
  return `<button class="prev ${open?'open':''}" onclick="toggleHist('${key}')">

}
function historyHTML(key){
  const all = docCtx(key).previous, n = all.length;
  const expanded = S.showAllOld || n<=PREV_INLINE;
  const shown = expanded ? all : all.slice(0,PREV_INLINE);
  /* Past ten rows the question stops being "which version" and becomes "what was I bound
     by in 2023" — so once expanded that far, the years become the index. Never paginated:
     you can't scan for a date that sits on another page. */
  let body;
  if(expanded && n>YEAR_GROUP_AT){
    const years=[...new Set(shown.map(p=>p.signed.slice(0,4)))];
    body = years.map(y=>{const rows=shown.filter(p=>p.signed.startsWith(y));
      return `<div class="yeargrp"><div class="yearhd">${y}<span>(${rows.length})</span></div>
        ${rows.map(p=>oldRow(p,key)).join('')}</div>`;}).join('');
  } else {
    body = shown.map(p=>oldRow(p,key)).join('');
  }
  return `<div class="oldbox">
    <p class="oldnote">${n} previous version${n===1?'':'s'}. Kept so you can always see the terms you
      actually agreed to, even after a newer version publishes.</p>
    ${body}
    ${n>PREV_INLINE?`<button class="prev showall" onclick="S.showAllOld=!S.showAllOld;render()">
      ${S.showAllOld?'Show fewer':`Show all ${n}`}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"${S.showAllOld?' style="transform:rotate(180deg)"':''}><polyline points="6 9 12 15 18 9"/></svg></button>`:''}
  </div>`;
}

   whole reason for keeping them. */
/* Which document the page is showing. One component serves the platform agreement and
   every project document, because they behave identically once they are versioned. */
function docCtx(key){
  const K = key || S.docKey;
  const d = PLATFORMDOCS.concat(PROJECTDOCS).find(x=>x.id===K) || PROJECTDOCS[0];
  return {key:d.id, title:d.title, project:d.project, platform:!d.project,
    version:d.version, effective:d.effective, previous:d.previous, pages:d.pages,
    signedOn: d.signed ? (d.signedOn || addDays(TODAY,0)) : null};

function verInfo(v){
  const c = docCtx();
  if(!v || v===c.version)
    return {v:c.version, effective:c.effective, signed:c.signedOn, current:true};
  const p = c.previous.find(x=>x.v===v) || c.previous[0];
  return {v:p.v, effective:p.effective, signed:p.signed, current:false};
}

const closeX = `<button class="x" onclick="closeScrim()" aria-label="Close">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg></button>`;

function drawProject(){
  const p = projById();
  if(!p) return closeScrim();

  /* Joined — read-only. Anything outstanding is shown here as a reminder, never as a gate:
     Go to Project stays live regardless. */
  if(S.openKind==='joined'){
    const due = outstandingFor(p.name);
    const late = due.some(r=>r.late);   // past its deadline; it still never blocks work here
    return scrim(`<div class="modal" data-m="project">
      <div class="mhead"><h3>${esc(p.name)}</h3>${closeX}</div>
      <div class="mbody">${modalBody(p, due.length?`<div class="reqs ${late?'':'softonly'}">
          <h4>${late?'Overdue':'Worth doing soon'}</h4>
          <div class="sub">${late
            ? 'Your work on this project carries on as normal. Please sign as soon as you can.'
            : 'None of this affects your work on this project — you can carry on as normal.'}</div>
          ${due.map(r=>`<div class="req ${r.late?'hard':''}">
            <span class="ri">${DOCMARK}</span>
            <span class="rt"><b>${r.label}</b>
              <span class="chiprow">
                <span class="chip ${r.scope==='project'?'this':'all'}">${r.scope==='project'?'Required for this project':'Required for all projects'}</span>
                ${r.badge?`<span class="due ${r.late||r.hard?'late':''}">${r.badge}</span>`:''}
              </span>
              <span class="reqsub">${r.sub}</span></span>
            <button class="btn ghost sm" onclick="${r.act}">${r.cta}</button>
          </div>`).join('')}
        </div>`:'')}</div>
      <div class="mfoot"><div class="sp"></div>
        <button class="btn pri" onclick="openWork('${p.id}')">Go to Project</button></div>
    </div>`);
  }

  /* Pending — nothing for the agent to do but wait, so there is no action at all. */
  if(S.openKind==='pending') return scrim(`<div class="modal" data-m="project">
    <div class="mhead"><div class="titlerow"><h3>${esc(p.name)}</h3>
      <span class="statepill"><i></i>Pending Approval</span></div>${closeX}</div>
    <div class="mbody" style="padding-bottom:28px">${modalBody(p)}</div>
  </div>`);

  /* Available — the gate lives here. */
  const reqs = requirements();
  const hard = reqs.filter(r=>r.hard);
  const soft = reqs.filter(r=>!r.hard);
  /* One layout at any number of blockers: every row states a requirement and carries its own
     action, and the footer always shows what the modal is for. The button's label stops
     changing meaning — only its state does. */
  scrim(`<div class="modal" data-m="project">
    <div class="mhead"><h3>${esc(p.name)}</h3>${closeX}</div>
    <div class="mbody">
      ${modalBody(p, reqs.length?`<div class="reqs ${hard.length?'':'softonly'}">
        <h4>${hard.length?'Before you can apply':'Worth doing soon'}</h4>
        <div class="sub">These apply to your whole account, not just this project.</div>
        ${reqs.map(r=>`<div class="req ${r.hard?'hard':''}">
          <span class="ri">${DOCMARK}</span>
          <span class="rt"><b>${r.label}</b>
            <span class="chiprow">
              <span class="chip ${r.scope==='project'?'this':'all'}">${r.scope==='project'?'Required for this project':'Required for all projects'}</span>
              ${r.badge?`<span class="due ${r.late||r.hard?'late':''}">${r.badge}</span>`:''}
            </span>
            <span class="reqsub">${r.sub}</span></span>
          <button class="btn ghost sm" onclick="${r.act}">${r.cta}</button>
        </div>`).join('')}
      </div>`:'')}
    </div>
    <div class="mfoot">
      ${hard.length
        ? `<div class="footnote late">*${hard.length===1?hard[0].note:'Finish the items above before applying.'}</div>`
        : `<div class="sp"></div>`}
      <button class="btn pri" ${hard.length?'disabled':''} onclick="applyNow()">Apply</button>
    </div>
  </div>`);
}

/* ============================================================
   DOC VIEWER + SIGN DIALOG  (one component, every document)
   ============================================================ */
let AFTER_SIGN = null;
function openDoc(key, after){
  AFTER_SIGN = after || null;
  const d = DOCS[key];
  scrim(`<div class="viewer">
    <div class="vhead">
      <button class="x" style="position:static" onclick="backFromDoc()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg></button>
      <span class="vt">${esc(d.title)}
        <span class="chip ${d.scope==='all'?'all':'this'}">${d.scope==='all'?'Required for all projects':'Required for this project'}</span></span>
      <button class="btn pri sm" onclick="signDialog('${key}')">Sign &amp; Continue</button>
    </div>
    <div class="vpaper"><div class="paper">${d.body}</div></div>
  </div>`);
}
function backFromDoc(){
  if(AFTER_SIGN==='docs') return drawProjectDocs();
  if(S.openProject) return drawProject();
  closeScrim();
}
function signDialog(key){
  const d = DOCS[key];
  scrim(`<div class="signbox">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8.5 12.2 11 14.7 15.8 9.6"/></svg></div>
    <h4>Sign ${esc(d.title)}</h4>
    <p>Type your full name to sign this contract.</p>
    <label for="fn">Full name</label>
    <input type="text" id="fn" autocomplete="off" oninput="syncConfirm()">
    <div class="chkrow">
      <input type="checkbox" id="sgck" onchange="syncConfirm()">
      <label for="sgck">I have read and accepted the ${esc(d.title)}.</label>
    </div>
    <div class="row">
      <button class="btn" onclick="openDoc('${key}',AFTER_SIGN)">Cancel</button>
      <button class="btn pri" id="cf" disabled onclick="doSign('${key}')">Confirm</button>
    </div>
  </div>`);
  setTimeout(()=>{const f=document.getElementById('fn'); if(f) f.focus();},0);
}
/* Same gate as the Legal page: a typed name AND an explicit acceptance. */
function syncConfirm(){
  const n=document.getElementById('fn'), c=document.getElementById('sgck'), b=document.getElementById('cf');
  if(b) b.disabled = !(n && n.value.trim() && c && c.checked);
}
function doSign(key){
  const c=document.getElementById('sgck');
  if(c && !c.checked) return;
  S.docs[key] = true;
  render();
  toast(DOCS[key].title+' signed.');
  drawProjectDocs();
}

   ============================================================ */
function openWork(id){ S.view='work'; S.workProject=id; S.taskOpen=false; closeScrim(); render(); }
function workHTML(){
  const p = JOINED.find(x=>x.id===S.workProject) || JOINED[0];
  const tasks = p.mode==='tasks';
  return `<button class="backlink" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="11 6 5 12 11 18"/></svg>
      Ongoing Projects</button>
    <h1 class="hi" style="margin-bottom:6px">${esc(p.name)}</h1>
    <p style="margin:0 0 26px;color:var(--ink3)">${tasks?'Data labelling · work any time':'Inbound · scheduled shifts'}</p>
    <div class="pcard">
      ${S.taskOpen?`<div class="worknow">
        <div><b>${tasks?'Task #4821':'Shift · today 14:00–18:00'}</b>
          <div class="meta">${tasks?'Started just now · 40 items in this batch':'In progress'}</div></div>
        <div class="sp"></div>
        <button class="btn pri" onclick="submitWork()">${tasks?'Submit task':'End shift'}</button>
      </div>`:''}
      <div class="workfoot">
        <div class="footnote" style="color:var(--ink3)">${
          tasks?'18 tasks available in this batch.':'3 shifts open this week.'}</div>
        <button class="btn pri" ${S.taskOpen?'disabled':''} onclick="startWork()">${
          tasks?'Claim next task':'Book next shift'}</button>
      </div>

function startWork(){
  const p = JOINED.find(x=>x.id===S.workProject);
  S.taskOpen=true; render();
  toast(p.mode==='tasks'?'Task claimed. Work on it whenever you like.':'Shift booked.');
}
function submitWork(){
  const p = JOINED.find(x=>x.id===S.workProject);
  S.taskOpen=false; render();
  toast(p.mode==='tasks'?"Task submitted. It's now in review.":'Shift completed.');
}

   ============================================================ */
function applyNow(){ drawProjectDocs(); }
function drawProjectDocs(){
  const p = AVAIL.find(x=>x.id===S.openProject);
  if(!p) return closeScrim();
  const all = S.docs.sow && S.docs.nda;
  const row = (k)=>`<div class="req ${S.docs[k]?'':'hard'}" style="${S.docs[k]?'background:var(--teal-s);border-color:#bfe6d7':''}">
    <span class="ri ${S.docs[k]?'ok':''}">${S.docs[k]?TICKMARK:DOCMARK}</span>
    <span class="rt"><b>${DOCS[k].title}</b>
      <span class="chip this">Required for this project</span>
      <span class="reqsub">${S.docs[k]?'Signed just now':'Not signed yet'}</span></span>
    ${S.docs[k]?'':`<button class="btn ghost sm" onclick="openDoc('${k}','docs')">Review &amp; sign</button>`}
  </div>`;
  scrim(`<div class="modal" style="width:min(620px,100%)">
    <div class="mhead"><h3>Apply to ${esc(p.name)}</h3>
      <button class="x" onclick="drawProject()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg></button></div>
    <div class="mbody">
      <p style="margin:0 0 16px;color:var(--ink2);font-size:14.5px">This client asks every agent on the project to
        sign the contracts below. They cover this project only.</p>
      <div class="reqs softonly" style="margin-top:0">${row('sow')}${row('nda')}</div>
    </div>
    <div class="mfoot"><div class="sp"></div>
      <button class="btn" onclick="drawProject()">Back</button>
      <button class="btn pri" ${all?'':'disabled'} onclick="finishApply()">Confirm application</button>
    </div>
  </div>`);
}
function finishApply(){
  const p = AVAIL.find(x=>x.id===S.openProject);
  S.applied.push(S.openProject); S.openProject=null;
  S.tab='joined'; S.sub='pending'; S.page=1;
  closeScrim(); render();
  toast("Applied to "+p.name+". It's now in your Pending Projects.");
}

  'book': '<svg viewBox="0 0 24 24" fill="none"> <path d="M4 19.5C4 18.837 4.26339 18.2011 4.73223 17.7322C5.20107 17.2634 5.83696 17 6.5 17H20M4 19.5C4 20.163 4.26339 20.7989 4.73223 21.2678C5.20107 21.7366 5.83696 22 6.5 22H20V2H6.5C5.83696 2 5.20107 2.26339 4.73223 2.73223C4.26339 3.20107 4 3.83696 4 4.5V19.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>',
  'help-circle': '<svg viewBox="0 0 24 24" fill="none"> <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13M12 17H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
};
const NAVITEMS = [
  {ic:'home',        lbl:'Home',      view:'home'},
  {ic:'trello',      lbl:'Dashboard'},
  {ic:'calendar',    lbl:'Schedule'},
  {ic:'trending-up', lbl:'Insights'},
  {ic:'rocket',      lbl:'Coaching'},
  {ic:'dollar-sign', lbl:'Earnings'},
  {ic:'user-plus',   lbl:'Referrals'}
];
const ACCTMENU = [
  {ic:'log-out',     lbl:'Logout', danger:true},
  {ic:'settings',    lbl:'Account Settings', view:'legal'},
  {ic:'book',        lbl:'Skills Center'},
  {ic:'help-circle', lbl:'Gig Corner'}
];
function navBtn(it){
  const on = it.view && (S.view===it.view || (it.view==='legal' && S.view==='doc'));
  const act = it.view ? `go('${it.view}')` : `toast('${it.lbl} is not part of this prototype')`;
  return `<button class="ritem ${on?'on':''} ${it.danger?'danger':''}" onclick="closeAcct();${act}">
    ${NAVICON[it.ic]}<b>${it.lbl}</b></button>`;
}
function railHTML(){
  return `<div class="railin">
    <div class="rnav">
      <div class="rlogo">
        <span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="word">Agents<br>Only</span></div>
      <div class="rgroup">${NAVITEMS.map(navBtn).join('')}</div>
    </div>
    <div class="rfoot">
      <div class="rgroup tight">
        <button class="ritem ${(S.view==='legal'||S.view==='doc')?'on':''}" onclick="toggleAcct(event)">
          ${NAVICON['settings']}<b>Settings</b></button></div>
      <div class="rdiv"></div>
      <div class="racct"><span class="rav"></span><b>Olivia Rhye</b></div>
    </div>
  </div>`;
}
function closeAcct(){
  document.getElementById('railsub').innerHTML='';
  document.getElementById('rail').classList.remove('pin');
}
function toggleAcct(e){
  e.stopPropagation();
  const host=document.getElementById('railsub');
  if(host.innerHTML) return closeAcct();
  document.getElementById('rail').classList.add('pin');   // keep the nav open while the menu is
  host.innerHTML=`<div class="rsub">${ACCTMENU.map(navBtn).join('')}</div>`;
  /* Line "Account Settings" up with the Settings item that opened the menu. */
  const sub=host.firstElementChild, r=e.currentTarget.getBoundingClientRect();
  const anchor=sub.children[1];
  const want = r.top + r.height/2 - (anchor.offsetTop + anchor.offsetHeight/2);
  sub.style.left = '240px';
  sub.style.top  = Math.min(window.innerHeight - sub.offsetHeight - 8, Math.max(8, want)) + 'px';
  setTimeout(()=>document.addEventListener('click',closeAcct,{once:true}),0);
}

/* ============================================================
   PLUMBING
   ============================================================ */
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function scrim(html){
  const o=document.getElementById('overlay');
  o.innerHTML=`<div class="scrim" onclick="closeScrim()">${html}</div>`;
  const m=o.querySelector('.scrim>*'); if(m) m.onclick=e=>e.stopPropagation();
}
function closeScrim(){ S.openProject=null; document.getElementById('overlay').innerHTML=''; }
function toast(msg){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),4000);
}
function go(v){ S.view=v; closeAcct(); closeScrim(); render(); }
/* Redraw the page and, if a project modal is open, the modal too — so flipping a control
   updates what you are looking at instead of throwing it away. */
function refresh(){
  render();
  if(S.openProject && document.querySelector('#overlay .modal[data-m="project"]')) drawProject();
}
/* Full wipe, only from the Reset button. */
function resetAll(){
  S.docs={sow:false,nda:false}; S.applied=[];
  S.gigReqs=false; S.histOpen={}; S.guideCol=false; S.showAllOld=false;
  S.sub='joined'; S.sort='new'; S.page=1; S.tab='available'; S.view='home';
  S.docKey='ica'; S.docVersion=null; S.signName=''; S.signChk=false;
  S.taskOpen=false; S.workProject=null;
  applyDue(); closeScrim(); render();
}
/* Which client contracts are outstanding, and whether they are still inside their window. */
function applyDue(){
  const n = S.due==='none' ? 0 : S.due==='p1' ? 1 : 2;
  const targets = ['rv-sow','qa-dha'];
  PROJECTDOCS.forEach(d=>{
    const i = targets.indexOf(d.id);
    if(i<0) return;                                     // the rest stay settled
    d.signed = i >= n;
    if(d.signed){ d.signedOn = d.signedOn || addDays(TODAY,0); }
    /* Windows are relative to today so both states stay demonstrable whenever this is opened. */
    d.due = S.state==='overdue' ? addDays(TODAY, i===0 ? -4 : -9)
                                : addDays(TODAY, i===0 ?  8 :  3);
    d.effective = addDays(new Date(d.due+'T00:00:00Z'), -PDOC_WINDOW);
  });
}
function setDue(v){   S.due=v;   applyDue(); refresh(); }
function setState(v){ S.state=v; applyDue(); refresh(); }
function stripHTML(){
  return `<div class="strip">
    <span class="scopetag">Current scope</span>
    <span class="sl">Contracts</span>
    <span class="segwrap">${[['none','None'],['p1','1'],['p2','2']].map(([k,l])=>
      `<button class="sb ${S.due===k?'on':''}" onclick="setDue('${k}')">${l}</button>`).join('')}</span>
    <span class="sl">Due</span>
    <span class="segwrap">${[['grace','In grace'],['overdue','Overdue']].map(([k,l])=>
      `<button class="sb ${S.state===k?'on':''}" onclick="setState('${k}')">${l}</button>`).join('')}</span>
    <button class="pb ${S.bankTax?'':'act'}" onclick="toggleBankTax()">Bank &amp; tax: ${S.bankTax?'filled':'missing'}</button>
    <button class="pb" onclick="resetAll()">Reset</button>
  </div>`;
}


/* Flipping a prerequisite has to redraw whatever project modal is already open, or the
   footer keeps showing the old verdict. */
function toggleBankTax(){ S.bankTax=!S.bankTax; refresh(); }
function render(){
  document.getElementById('rail').innerHTML  = railHTML();
  document.getElementById('view').innerHTML  =
      S.view==='home' ? homeHTML() : S.view==='work' ? workHTML()
      : S.view==='doc' ? docHTML() : legalHTML();
  document.getElementById('strip').innerHTML = stripHTML();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScrim();});
/* Reconcile the seeded contracts with whatever the Due control defaults to, so the widget
   and the toolbar never disagree at startup. */
applyDue();
render();
</script>
