   ============================================================ */
function projectDocItems(){
  const due = PROJECTDOCS.filter(d=>!d.signed);
  if(!due.length) return [];
  /* The word has to say "you have signed this before" without ever being "re-sign".
     Hyphenated, it collapses into "resign" — quit — for anyone scanning quickly or reading
     in a second language, and it turns up on a row that is already telling the agent they
     are blocked from a project. "Sign … again" carries the same meaning, cannot be misread,
     and is simpler English besides. */
  if(due.length===1) return [{done:false, contract:true,
    lbl: isResign(due[0])
      ? 'Sign '+due[0].title+' again — '+due[0].project
      : 'Sign '+due[0].title+' — '+due[0].project,
    act:"openLegalDoc('"+due[0].id+"')"}];
  /* Name the project whenever they are all in one — a count is only worth using when there
     is nothing more specific to say. */
  const projects=[...new Set(due.map(d=>d.project))];
  /* Only say "again" when every outstanding contract is a renewal. Mixed goes back to the
     plain wording, because "again" would be wrong for half the list. */
  const allAgain = due.every(isResign);
  if(projects.length===1) return [{done:false, contract:true,
    lbl:'Sign '+due.length+' project contracts'+(allAgain?' again':'')+' in '+projects[0],
    /* The widget is a reminder, so it lands where contracts live rather than dropping the
       agent into a project they may not have been heading for. */
    act:"go('legal')"}];
  return [{done:false, contract:true,
    lbl:'Sign '+due.length+' project contracts'+(allAgain?' again':'')
        +' across '+projects.length+' projects',
    act:"go('legal')"}];
}
/* An existing agent has no setup left, so the widget carries only what is outstanding. A new
   agent gets the onboarding checklist behind it too.
   The platform contract never appears here — it gates the portal, so you cannot reach this. */
function guideItems(){
  if(S.existing){
    const items = [];
    if(!S.bankTax){
      items.push({done:false, lbl:'Add bank details', act:"toast('Would open Settings → Bank Details')"});
      items.push({done:false, lbl:'Add tax info',     act:"toast('Would open Settings → Tax Information')"});
    }
    return items.concat(projectDocItems());
  }
  const items = [
    {done:true,  lbl:'Create your account'},
    {done:true,  lbl:'Add bank details'},
    {done:S.bankTax, lbl:'Add tax info'}
  ];
  /* Not urgent enough to gate the portal, but it gates applying — so it earns a checklist line. */
  items.push({done:BGC().signed, lbl:'Complete background check consent', act:"openBgc()"});
  projectDocItems().forEach(i=>items.push(i));
  if(!S.gigReqs) items.push({done:false, lbl:'Complete Gig Requirements', act:"completeGigReqs()"});
  return items;
}
function guideHTML(){
  const items = guideItems();
  const outstanding = items.filter(i=>!i.done).length;
  /* Nothing outstanding means the card is gone. A checklist that lingers at 100% becomes
     wallpaper, and the agent stops seeing it by the time something urgent lands in it. */
  /* Nothing outstanding means no widget. There is no onboarding checklist behind this in
     current scope, so there is nothing to congratulate the agent for finishing. */
  /* A new agent finishing onboarding has earned a moment; an existing agent never had a
     checklist here, so the card simply goes. */
  if(!outstanding){
    if(S.existing) return '';
    return `<div class="allset">
      <span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <span><b>You're all set</b> — nothing outstanding</span></div>`;
  }
  const done = items.filter(i=>i.done).length;
  /* Reminder-only mode: no progress to report, and "Setup guide" would be the wrong word. */
  const reminderOnly = done===0;
  return `<div class="guide ${S.guideCol?'col':''}">
    <div class="ghead"><h2>${reminderOnly?'Action required':'Setup guide'}</h2>
      <span class="gcount">${outstanding} left</span>
      <button class="gtog" onclick="S.guideCol=!S.guideCol;render()" aria-label="Collapse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button></div>
    ${reminderOnly?'':`<div class="gbar"><i style="width:${Math.round(done/items.length*100)}%"></i></div>`}
    <div class="glist">
      ${items.map(i=>{
        const tag = i.act ? 'button' : 'div';
        /* A contract is the only row here that blocks something. Onboarding steps are things
           the agent still has to get round to; a contract is a door already shut. Colouring
           only the contract keeps that difference legible — colouring everything would just be
           a louder list. */
        const cls = ['gitem', i.done&&'done', i.act&&'act', i.contract&&'ctr'].filter(Boolean).join(' ');
        return `<${tag} class="${cls}"${i.act?` type="button" onclick="${i.act}"`:''}>
          <span class="dot">${i.done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}</span>
          <span class="gtxt"><span class="lbl">${i.lbl}</span>
            ${i.due?`<span class="due ${i.late?'late':''}">${i.due}</span>`:''}</span>
        </${tag}>`;
      }).join('')}
    </div>
    ${reminderOnly?'':`<div class="gfoot">Unlock all projects by completing your profile &amp; the Gig Requirements</div>`}
  </div>`;
}

const PER_PAGE = 9;

}

const legalIncomplete = () => PROJECTDOCS.some(d=>!d.signed) || !BGC().signed;

function setShell(inner){

    ? `<span class="ihint" tabindex="0">!<span class="tip">Incomplete section</span></span>` : '';
  return `<div class="sheet">
    <h1>Settings</h1>
    <div class="setgrid">
      <nav class="setnav">
        ${['Personal Information','Skills & Preferences','Work Experience','Job Matching Profile','Bank Details','Tax Information','Referral Payments','Gig Requirements']

function sigStamp(iso){
  const k = ctry();
  const u = new Date(iso+'T'+SIGN_UTC+'Z'), l = new Date(u.getTime()+k.tz*3600000);
  const f = d => fmt(d.toISOString().slice(0,10))+', '+d.toISOString().slice(11,19);
  return {utc:f(u), local:f(l)+' ('+k.tzLabel+')', localDate:fmt(l.toISOString().slice(0,10))};
}
function fakeHash(str){
  let h = 0x811c9dc5, out = '';
  for(let r=0;r<8;r++){ for(const ch of str+'|'+r){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619)>>>0; }
    out += h.toString(16).padStart(8,'0'); }
  return out;
}
/* [label, value, note]. A null value is a field the platform does not have yet. */
function execRows(c, signed){
  const k = ctry();
  return [
    {h:'Agreement details', rows:[
      ['Agreement', c.title], c.project && ['Project', c.project], ['Country', k.name],
      ['Effective date', sigStamp(signed).localDate+' ('+k.tzLabel+')'],
      k.seat && ['Arbitration & governing law', k.seat]]},
    {h:'Contractor details', rows:[
      ['Contractor name', AGENT_NAME],
      k.entity && ['Entity type', k.entity],
      ['Address', k.address],   // mandatory at onboarding, so always on file
      ['Email', AGENT_EMAIL],
      k.id && [k.id.label, k.id.value]]},
    {h:'Company details', rows:[
      ['Company', COMPANY.name], ['Company registration no.', COMPANY.reg],
      ['Company address', COMPANY.addr], ['Company signatory', COMPANY.signatory]]}
  ].map(sec=>({h:sec.h, rows:sec.rows.filter(Boolean)}));
}

        signing in Section 4, the Contractor confirms that these details are accurate and agrees to be bound by the
        Agreement.</p>

      `<tr><td>${esc(l)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`).join('')}
    <div class="xps">4. Execution</div>
    <div class="xpsig">
      ${sig('CONTRACTOR', AGENT_NAME, `Signed (UTC): ${t.utc}<br>Signed (local): ${t.local}`)}
      ${sig('COMPANY', 'Michael Cole', `Name and title: ${COMPANY.signatory}<br>Signed (UTC): ${t.utc}`)}

/* Three screens, as in Figma: Consent → Declaration → Confirmation to Continue. Every answer
   path ends on the same confirmation; what a "Yes" triggers happens later, in the check itself. */
function bgcHTML(){
  const k = BGC_COUNTRY[S.country] || BGC_COUNTRY.my, st = S.bgcStep;
  const V = !!S.bgcView, sv = S.bgcSaved || BGC_DEFAULT_SAVED;
  const agree = V ? sv.agree : S.bgcAgree, ans = V ? sv.ans : S.bgcAns, confirm = V ? sv.confirm : S.bgcConfirm;
  const lock = V ? 'disabled' : '';
  if(st===1) return setShell(`<div class="bgwrap ${V?'bgview':''}">
    <h2>Background Check Consent</h2>
    <p class="bgp">Welcome, Olivia!<br>Your background check will only be required <b>if a client selects you to join a
      project</b>. If that happens, you will be asked to complete a few essential checks at that time.</p>
    <img class="bgill" src="${BGC_IMG_CONSENT}" alt="" width="96">
    <div class="bgbox red">
      <p>We perform a comprehensive background check consisting of:</p>
      <ul><li>Identity verification (based on government-issued ID),</li><li>${esc(k.check)},</li>
        <li>National Sex Offender Registry Check,</li><li>Global Sanctions and Watchlist Check.</li></ul>
      <p>The check typically covers the last 7 years.</p>
      <div class="chkrow"><input type="checkbox" id="bgck" ${agree?'checked':''} ${lock}
          onchange="S.bgcAgree=this.checked;document.getElementById('bgn1').disabled=!this.checked">
        <label for="bgck">I agree to undergo a background check when I'm selected for a project.</label></div>
    </div>
    <div class="bgfoot"><span></span>
      <button class="btn pri bgbtn" id="bgn1" ${V||agree?'':'disabled'} onclick="bgcGo(2)">Next</button></div>
  </div>`);
  if(st===2) return setShell(`<div class="bgwrap ${V?'bgview':''}">
    <h2>Criminal History Declaration</h2>
    <p class="bglead">Please indicate whether you have been convicted of any of the following offenses under ${esc(k.law)}
      law or equivalent foreign laws. A background check will be conducted to verify your response.</p>
    <div class="bgq">${OFFENCES.map(([key,l])=>`<div class="bgqr"><span class="bgql">${esc(l)}</span>
      ${['yes','no'].map(v=>`<label class="bgrad"><input type="radio" name="bg_${key}" ${ans[key]===v?'checked':''} ${lock}
        onchange="bgcSet('${key}','${v}')">${v==='yes'?'Yes':'No'}</label>`).join('')}</div>`).join('')}</div>
    <div class="bgfoot"><button class="btn bgbtn" onclick="bgcGo(1)">Back</button>
      <button class="btn pri bgbtn" ${V||bgcAllAnswered()?'':'disabled'} onclick="bgcGo(3)">Next</button></div>
  </div>`);
  return setShell(`<div class="bgwrap ${V?'bgview':''}">
    <h2>Confirmation to Continue</h2>
    <img class="bgill" src="${BGC_IMG_CONFIRM}" alt="" width="132">
    <div class="bgbox amber">
      <div class="chkrow"><input type="checkbox" id="bgaff" ${confirm?'checked':''} ${lock}
          onchange="S.bgcConfirm=this.checked;document.getElementById('bgcsub').disabled=!this.checked">
        <label for="bgaff">I affirm that all information provided is true, accurate, and complete to the best of my
          knowledge. I understand that providing false or misleading information could be considered fraudulent and
          may result in legal consequences.</label></div>
    </div>
    <div class="bgfoot"><button class="btn bgbtn" onclick="bgcGo(2)">Back</button>
      <button class="btn pri bgbtn" id="bgcsub" ${!V&&confirm?'':'disabled'} onclick="bgcSubmit()">Submit</button></div>
  </div>`);
}

/* ============================================================
   DOCUMENT VIEW — sign, and later review, in the place the doc lives
   ============================================================ */
const DOC_PAGES = 13;
/* How a document identifies itself. A project contract has nothing to add — there is only ever
   one of each, so a number would be noise. A platform contract gives its version number and
   nothing more: the jurisdiction it belongs to is a fact about the model, not something an
   agent-facing badge has to carry, and a plain number is what the API can be relied on to
   return. */
function docStamp(c, info){
  if(!c.platform) return '';
  return 'V'+info.v;
}
/* Project documents are short. Same frame, same signing block, less paper. */
function projectPaper(n, info, c){
  if(!c.legacy && !c.step && info.signed && n===c.pages+1) return execPage(c, info.signed);
  const stamp = docStamp(c, info);
  const revised = info.current && c.previous && c.previous.length;
  const head = `<div class="aologo"><span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <b>Agents<br>Only</b></div>
    <h5>${esc(c.title)}</h5>
    <p style="text-align:center;color:#7c8a9c;margin-bottom:26px">${c.platform?'AgentsOnly':esc(c.project)}${stamp?' · '+stamp:''} · Effective ${fmt(info.effective)}</p>`;
  if(n===1 && c.platform) return head + `
    <p>This contract is between AgentsOnly and the Contractor and governs every project the
      Contractor works on through the Platform.</p>
    <p class="cl">1.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;SCOPE</p>
    <p class="ind">Contractor may access personal data belonging to Company clients while performing
      services. This contract sets out how that data must be handled.</p>
    <p class="cl">2.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;PROCESSING</p>
    <p class="ind">(a)&nbsp;&nbsp;&nbsp;&nbsp;Contractor will process personal data only on documented
      instructions from the Company, and only for the project it was provided for.</p>
    <p class="ind">(b)&nbsp;&nbsp;&nbsp;&nbsp;Contractor will not transfer personal data outside the tools
      the Company provides.${revised?' <b>New in the '+stamp+':</b> extended to cover AI assistants and any third-party tooling.':''}</p>
    <p class="cl">3.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;RETENTION</p>
    <p class="ind">Contractor will retain personal data no longer than the task requires, and will
      delete or return it on request.</p>
    <p class="cl">4.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;INCIDENTS</p>
    <p class="ind">Contractor will report any suspected breach to the Company without undue delay and
      in any event within twenty-four (24) hours of becoming aware of it.</p>`;
  if(n===1) return head + partiesPara(c) + `
    <p>This contract is issued by the client for the <b>${esc(c.project)}</b> project and applies only to work
      performed on that project. It supplements, and does not replace, the Independent Contractor Agreement.</p>
    <p class="cl">1.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;SCOPE</p>
    <p class="ind">(a)&nbsp;&nbsp;&nbsp;&nbsp;Contractor will perform the services described in the project brief,
      using the tools and workflows the client provides through the Platform.</p>
    <p class="ind">(b)&nbsp;&nbsp;&nbsp;&nbsp;Contractor will complete any client-specific training module before
      handling live work.</p>
    <p class="cl">2.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;QUALITY</p>
    <p class="ind">Contractor will maintain an average quality score of 3.5 or above across any
      rolling thirty-day period.</p>
    <p class="cl">3.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;CONFIDENTIALITY</p>
    <p class="ind">Contractor will not disclose client data, materials or pricing encountered on this project, and
      will return or destroy such materials on request.</p>
    ${hasFee(c)?`<p class="cl">4.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;FEE</p><p class="ind">${feeClause()}</p>`:''}`;
  return head + `
    <p class="cl">${n+2}.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;FURTHER TERMS</p>
    <p class="ind">Placeholder text standing in for the remaining clauses of this document.</p>
    ${!c.step && n===c.pages ? origSig(info.signed) : ''}
    <p style="text-align:center;color:#9aa8b8;margin-top:40px">— ${stamp?stamp+' · ':''}Page ${n} of ${c.pages} —</p>`;
}
/* Which version's terms are on screen. Previous versions really do differ — that is the
   whole reason for keeping them. */
/* Which document the page is showing. One component serves the platform agreement and
   every project document, because they behave identically once they are versioned. */
function docCtx(key){
  const K = key || S.docKey;
  const d = PLATFORMDOCS.concat(PROJECTDOCS).find(x=>x.id===K) || PROJECTDOCS[0];
  return {key:d.id, title:d.title, project:d.project, platform:!d.project,
    version:d.version, effective:d.effective, previous:d.previous, pages:d.pages,
    /* `lastSigned` survives an expiry — the signature that ran out is what the renewal notice
       is about, so it cannot be cleared when the document goes back to unsigned. */
    resign:isResign(d), country:d.country, renewMonths:d.renewMonths, lastSigned:d.signedOn,
    legacy:!!d.legacy, step:!!d.step,

function verInfo(v){
  const c = docCtx();

    return {v:c.version, effective:c.effective, signed:c.signedOn, current:true};
  const p = c.previous.find(x=>x.v===v) || c.previous[0];
  return {v:p.v, effective:p.effective, signed:p.signed, current:false};
}

/* Read-only viewer behaves like the Google Drive PDF preview: the pages sit straight on the dark
   backdrop, the whole view scrolls, and a floating pill shows "Page n / N" with zoom. */
const PDF_ZOOMS = [0.75, 1, 1.25, 1.5];
function drawSignedDoc(){
  const c = docCtx(S.viewKey);
  const info = {v:c.version, effective:c.effective, signed:c.signedOn, current:true};
  const last = docTotal(c, c.signedOn);
  const z = S.pdfZoom || 1;
  const prev = document.getElementById('pdfbody');
  const keep = prev ? prev.scrollTop / Math.max(1, prev.scrollHeight) : 0;   // survive redraws (zoom, country)
  scrim(`<div class="fullview pdfview" data-v="signed">
    <div class="fvbar">
      <button class="x" onclick="closeScrim()" aria-label="Close">

    </div>
    <div class="pdfbody" id="pdfbody" onscroll="pdfTrack()">
      <div class="pdfpages" style="zoom:${z}">${Array.from({length:last},(_,i)=>
        `<div class="paperpg pdfpg" data-pg="${i+1}">${projectPaper(i+1, info, c)}</div>`).join('')}</div>
    </div>
    <div class="pdfctl">
      <span>Page <b id="pdfn">1</b> / ${last}</span><i></i>
      <button onclick="pdfZoom(-1)" ${z===PDF_ZOOMS[0]?'disabled':''} aria-label="Zoom out">&minus;</button>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <button onclick="pdfZoom(1)" ${z===PDF_ZOOMS[PDF_ZOOMS.length-1]?'disabled':''} aria-label="Zoom in">+</button>
    </div>
  </div>`);
  const b = document.getElementById('pdfbody');
  if(b && keep){ b.scrollTop = keep * b.scrollHeight; }
  pdfTrack();
}
function pdfTrack(){
  const b = document.getElementById('pdfbody'), n = document.getElementById('pdfn'); if(!b||!n) return;
  const mid = b.getBoundingClientRect().top + b.clientHeight/3;
  let cur = 1;
  b.querySelectorAll('.pdfpg').forEach(pg=>{ if(pg.getBoundingClientRect().top <= mid) cur = +pg.dataset.pg; });
  n.textContent = cur;
}
function pdfZoom(dir){
  const k = PDF_ZOOMS.indexOf(S.pdfZoom || 1);
  S.pdfZoom = PDF_ZOOMS[Math.min(PDF_ZOOMS.length-1, Math.max(0, k+dir))];

function submitSign(){
  if(!(S.signName.trim() && S.signChk)) return;
  const modal = signModalOpen();
  const c=docCtx(modal ? S.signKey : null);
  const wasResign=c.resign;
  const d=PROJECTDOCS.find(x=>x.id===c.key); d.signed=true; d.signedOn=addDays(TODAY,0);
  /* From the modal: close it and go back to the list, where the row now shows its signed date. */
  if(modal){
    S.signKey=null; closeScrim(); render();
    return toast(signedMsg(c.project, c.title) + (wasResign ? ' Next due in '+c.renewMonths+' months.' : ''));
  }
  /* Land on the page that was just added, so the agent sees their signed details. */
  if(!c.platform) S.docPage = c.pages+1;
  render();
  /* A renewal is worth confirming as a renewal: the agent knows they signed this before, so
     "signed" alone leaves them wondering whether the right thing happened. */
  toast(wasResign
    ? c.title+' signed again. Next due in '+c.renewMonths+' months.'
    : c.title+' signed.');

function doSign(key){

  S.docs[key] = true; S.docsOn[key] = addDays(TODAY,0);

     once everything is signed, or when the agent closes a contract with the X. */
  const next = ['sow','nda'].find(k=>!S.docs[k]);

const projLocked = name => PROJECTDOCS.some(d=>d.project===name && !d.signed);
function pickDash(id){
  const p = JOINED.find(x=>x.id===id);

/* The rule for what a project contract blocks is the project selector at the top of the page.
   A page that carries the selector is scoped to one project, so an unsigned contract for that
   project replaces its body with the gate. A page without it — Schedule, Earnings, Referrals,
   account settings — belongs to the agent rather than to the project, and is never blocked.
   Earnings most of all: that money is already earned.
   Written as a rule rather than as a list of three pages, so that a project-scoped page added
   later inherits the block instead of quietly missing it. Missing it is not theoretical — an
   agent who opens Insights before Dashboard walks straight past a gate that only Dashboard has. */
const PROJPAGES = {dash:'Dashboard', insights:'Insights', coaching:'Coaching'};

function projHead(p, cta){
  return `<div class="dashhead">
      <button class="dashsel" onclick="S.dashSel=!S.dashSel;render()">${esc(p.name)}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
      <div class="sp"></div>
      ${cta||''}
      ${S.dashSel?`<div class="dashmenu">${JOINED.map(j=>`
        <button class="dashopt" onclick="pickDash('${j.id}')">
          <span>${esc(j.name)}</span>
          ${projLocked(j.name)?`<span class="lockchip">${DOCMARK}Signature required</span>`:''}
        </button>`).join('')}</div>`:''}
    </div>`;
}
/* One shell for all three. The gate takes the place of the body, never of the header — the
   agent keeps the project selector, so switching to a project they can still open is one click
   and not a dead end. */
function projPage(kind){
  const p = JOINED.find(x=>x.id===S.dashProject) || JOINED[0];
  const locked = projLocked(p.name);
  /* Handle Contacts Now hands the agent off to the client platform to do the work, so it is
     the one control on these pages that has to go dead with the contract. */
  const cta = kind==='dash'
    ? `<button class="btn pri" ${locked?'disabled':''}
        onclick="toast('Would hand you off to the client platform to work')">Handle Contacts Now</button>`
    : '';
  /* No gate replacing the page any more (PO, 30 Sep): the page stays, a banner says what is
     needed, and only Handle Contacts Now and the table are disabled. Everything else — side
     column, schedule, tasks — shows as usual; those cannot be locked. */
  const body = kind==='dash' ? dashBody(locked) : kind==='insights' ? insightsBody() : coachingBody();
  /* Dashboard keeps the branded column. Insights puts its reliability metrics in the rail as
     plain cards under a heading, the way the real screen does. Coaching has no rail.
     A locked project has no rail either, whichever page it is. The rail carries that project's
     numbers — star rating, earnings, adherence — so leaving it up beside the gate would publish
     the very figures the gate is there to withhold. The gate covers exactly what it blocks: the
     whole content area, with only the project selector left standing so the agent can move on. */
  const aside = kind==='dash'
    ? `<aside class="dashside">
         <div class="sidecard"><b>4.2</b><span class="stars">\u2605\u2605\u2605\u2605<span class="dim">\u2605</span></span>
           <div class="sl2">Star Rating</div></div>

           <div class="ms">\u20B969,321.95 base \u00B7 \u20B930,600.00 star bonus</div></div>
       </aside>`
    : kind==='insights'
    ? `<aside class="dashside plain">
         <div class="railttl">Reliability Metrics<span class="ms">Previous week data</span></div>
         <div class="relcard">
           <div class="relhd">${NAVICON['calendar']}Schedule adherence</div>
           <div class="relbig"><span class="relpill good">97%</span>
             <span class="relstar">\u2b50 You're a STAR!</span></div>

         </div>
         <div class="relcard">
           <div class="relhd">${BANICON}Cancellation rate</div>
           <div class="relbig"><span class="relpill bad">15%</span></div>
           <div class="relsub">Preferred agent average <b>8%</b></div>
         </div>
         <div class="relcard">
           <div class="relhd">${BOLTICON}Surge minutes delivered</div>

             <span class="relsub" style="margin:0">mins</span></div>
         </div>
       </aside>`
    : '';
  /* Insights: the project header and the banner run the full width, above both the chart and
     the Reliability Metrics rail (per design). Dashboard and Coaching keep them in the main column. */
  if(kind==='insights') return `${projHead(p, cta)}
    ${locked ? projBanner(p) : ''}
    <div class="dashgrid ${aside?'':'solo'}"><div class="dashmain">${body}</div>${aside}</div>`;
  return `<div class="dashgrid ${aside?'':'solo'}"><div class="dashmain">
    ${kind==='dash'?`<h1 class="hi" style="margin-bottom:18px">Welcome back, Olivia!</h1>`:''}
    ${projHead(p, cta)}

}

/* The one message a locked project page carries. It names the project and the count, and its
   button goes to where contracts are signed: with one contract, straight into its sign modal;
   with several, Settings → Legal at that project's group. A renewal gets its own sentence. */
const WARNTRI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`;
const ARROWR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="13 6 19 12 13 18"/></svg>`;
/* One "Action required" banner, as on Wallet: warning icon, header, one sentence, Review & sign. */
function actionBanner(msg, act){
  return `<div class="pbanner" role="status">
    <span class="pbic">${WARNTRI}</span>
    <span class="pbtx"><b class="pbh">Action required</b><span>${msg}</span></span>
    <button class="btn sm pbbtn" onclick="${act}">Review &amp; sign ${ARROWR}</button>
  </div>`;
}
/* Where Review & sign goes: one contract → straight into its sign modal; several → Settings →
   Legal at that project's group (or the Legal page, when they span projects). */
const signAct = due => due.length===1 ? `openLegalDoc('${due[0].id}')`
  : new Set(due.map(d=>d.project)).size===1 ? `goLegalGroup('${esc(due[0].project)}')` : `go('legal')`;
/* ONE sentence per surface, singular/plural only — new contracts and renewals share it. The
   wording is neutral about why the contract is there ("has … to sign"), so it stays true for a
   newly added contract and for an expired signature alike. The sign modal itself still explains a
   renewal. */
function projBanner(p){
  const due = PROJECTDOCS.filter(d=>d.project===p.name && !d.signed);
  if(!due.length) return '';
  const msg = due.length===1
    ? `${esc(p.name)} has a contract for you to sign. You must sign it before you can keep working on this project.`
    : `${esc(p.name)} has ${due.length} contracts for you to sign. You must sign them before you can keep working on this project.`;
  return actionBanner(msg, signAct(due));
}
/* Earnings: not about one project, so it names the project (or counts them). */
function walletBanner(){
  const due = PROJECTDOCS.filter(d=>!d.signed);
  if(!due.length) return '';
  const projects = [...new Set(due.map(d=>d.project))];
  const msg = projects.length>1
    ? `You have ${due.length} contracts ready for signature across ${projects.length} projects. You must sign them before you can access those projects.`
    : due.length===1
      ? `Your contract for ${esc(projects[0])} is ready for signature. You must sign it before you can access the project.`
      : `Your ${due.length} contracts for ${esc(projects[0])} are ready for signature. You must sign them before you can access the project.`;
  return actionBanner(msg, signAct(due));
}
function goLegalGroup(name){
  go('legal');
  const g = [...document.querySelectorAll('.projgrp')].find(x=>x.dataset.proj===name);
  if(g){ g.scrollIntoView && g.scrollIntoView({behavior:'smooth',block:'start'});

function walletHTML(){
  const info = [
    [WICON.refresh,'10am PST','Daily transfer from 10am onwards'],
    [WICON.clock,'7am PST','Deadline to withdraw'],
    [WICON.layers,'2 times/week','Free transaction cost'],
    [WICON.dollar,'$5','Additional transaction fee']

  return `<div class="walgrid">
    <div class="walmain">
      <div class="waltop">
        <div class="balcard">
          <span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <div class="bl">Current Balance</div>
          <div class="bn"><span>$</span>58,072.24</div>
        </div>
        <div class="wdcard">
          <h3>Withdraw</h3>
          <div class="wdacct">Account: <b>xxxx-9876</b>
            <button class="wdedit" onclick="toast('Would open account details')">${WICON.pen}</button></div>
          <label class="wdlab" for="wdamt">Amount</label>
          <input id="wdamt" class="wdinput" type="text" value="$50" autocomplete="off">
          <button class="btn pri wide" onclick="toast('Would start a withdrawal')">Withdraw</button>
        </div>
      </div>
      ${/* The "earnings on hold" note is gone: devs cannot hold earnings per project (PO). */''}
      ${walletBanner()}

        <h3 class="txttl">Transaction history</h3>
        <table class="txtbl"><thead><tr><th>Date</th><th>Status</th><th>Detail</th><th>Earnings</th></tr></thead>
        <tbody>${TX.map(([dt,st,k,det,id,amt,pos])=>`<tr>
          <td class="txd">${dt}</td>
          <td><span class="pill ${k}">${TXICON[k]}${st}</span></td>
          <td><div class="txn">${det}</div>${id?`<div class="txid">ID: ${id}</div>`:''}</td>
          <td class="txa ${pos}">${amt}</td>
        </tr>`).join('')}</tbody></table>
        <div class="pager txpager">
          <button class="pgb" disabled>${'\u2190'} Prev</button>
          ${[1,2,3,4,5,'\u2026',10].map(n=>n==='\u2026'
            ? `<span class="pgn" style="cursor:default">\u2026</span>`
            : `<button class="pgn ${n===1?'on':''}" onclick="toast('Not part of this prototype')">${n}</button>`).join('')}

        </div>
      </div>
    </div>
    <aside class="walside">
      <div class="walinfo">${info.map(([ic,k,v])=>`
        <div class="wrow"><span class="wic">${ic}</span><b>${k}</b><span class="wv">${v}</span></div>`).join('')}
      </div>
      <img class="walart" src="${EARNINGS_ART}" alt="">
    </aside>
  </div>`;
}

/* 120 minutes is the gate. Anything short of it shows how far along they are; reaching it
   swaps the bar for a completed one with a tick, because "done" is a different fact from
   "nearly there". */
function gateBar(mins){
  const done = mins>=120, pct = Math.max(4, Math.round(mins/120*100));
  return `<span class="refgbar"><span class="gfill ${done?'done':''}" style="width:${pct}%">
      ${done?`<span class="gtick">${RICON.tick}</span>`:''}</span></span>
    <span class="gmins"><b>${mins}</b> mins</span>`;
}

function openWork(id){
  /* The contract comes first — the workspace is project work too. */
  const jp = JOINED.find(x=>x.id===id);
  if(jp && projLocked(jp.name)) return openProjectDash(id);
  S.view='work'; S.workProject=id; S.taskOpen=false; closeScrim(); render();
}

/* ============================================================
   PLATFORM CONTRACT GATE
   ============================================================ */
/* A gate should cover exactly what it blocks, and no more.
     platform contract -> the whole portal, so a full-screen scrim
     project contract  -> that project's dashboard body, so the rail, the project selector
                          and every other section stay reachable.
   Blocking the portal over one project would lock an agent out of Schedule, Earnings and
   Referrals, which that contract has no claim on — and if it is their only project,
   "choose another" is an empty offer. */
/* More than one contract can be outstanding at once, so a gate is a queue. One document goes
   straight to the document; several list themselves first, so the agent can see what they are
   in for rather than meeting them one at a time. Same rule as the reminder widget: name it at
   one, count it past one. */
/* The set is every contract in this round, signed or not — so one already accepted stays
   listed and re-readable while the agent works through the rest. The queue is what is left. */
function gateSet(){
  if(platformBlocked()) return PLATFORMDOCS.filter(d=>d.reissued);
  const p = JOINED.find(x=>x.id===S.dashProject);
  return p ? PROJECTDOCS.filter(d=>d.project===p.name && d.reissued) : [];
}
const gateQueue = () => gateSet().filter(d=>!d.signed);
function gateDoc(){
  const set = gateSet(), q = gateQueue(); if(!q.length) return null;
  if(S.gateList) return null;                 // the agent asked for the list explicitly
  if(S.gatePick){ const d=set.find(x=>x.id===S.gatePick); if(d) return d; }
  return q.length===1 ? q[0] : null;          // null means: show the list
}
function pickGateDoc(id){ S.gateList=false; S.gatePick=id; S.gateName=''; S.gateChk=false; S.gatePage=1; render(); }
function backToQueue(){ S.gateList=true; S.gatePick=null; S.gateName=''; S.gateChk=false; S.gatePage=1; render(); }

function gateListHTML(){
  const set = gateSet(), q = gateQueue();
  const platform = !set[0].project;
  const allResign = !platform && q.every(d=>isResign(d));
  return `<div class="gatehead">
      <h3>${q.length} of ${set.length} contracts need your signature</h3>
      <p>${platform
        /* One sentence for new agents and re-issues alike: it only has to say what is needed and what
           it unlocks, not why the agreements are here. */
        ? `Sign your agreements with AgentsOnly to use the portal.`
        : allResign
          ? `Your signatures on these contracts have expired under your country's contractor law.
             They are the same documents you already signed — sign them again before you can work
             on this project or open its dashboard, insights or coaching. Everything else in the
             portal still works.`
          : `${esc(q[0].project)} has added new contracts. Sign all of them before you can work on this
             project or open its dashboard, insights or coaching. Everything else in the portal
             still works.`}</p>
    </div>
    <div class="gatebody">
      <div class="reqs">
        ${set.map(d=>`<div class="req">
          <span class="ri ${d.signed?'ok':''}">${d.signed?TICKMARK:DOCMARK}</span>
          <span class="rt"><b>${esc(d.title)}</b>
            ${/* No scope chip. Every row in this list has the same scope, and the paragraph above
                 has already said it in a sentence — so the chip only added a row of noise. */''}
            ${d.signed?`<span class="chiprow">${signedTag(d.signedOn)}</span>`:''}
</span>
          <button class="btn ghost sm" onclick="pickGateDoc('${d.id}')">${d.signed?'View':'Review &amp; sign'}</button>
        </div>`).join('')}
      </div>
    </div>
    <div class="gatefoot">
      ${platform?`<button class="lnk" onclick="toast('Would log you out')">Log out</button>
                  <button class="lnk" onclick="toast('Would open support')">Contact support</button>`:''}
      <div class="sp"></div>
    </div>`;
}
/* Whatever the host, the content is the list or one document from it. */
function gateContent(){
  const q = gateQueue(); if(!q.length) return '';
  const d = gateDoc();
  return d ? contractCard(d, gateSet().length>1) : gateListHTML();
}
function contractCard(d, fromList){
  const platform = !d.project;
  const done  = !!d.signed;                  // already accepted this round — read-only
  const info = {v:d.version, effective:d.effective, signed:done?d.signedOn:null, current:true};
  const c = {key:d.id, title:d.title, project:d.project, platform, version:d.version,
             effective:d.effective, previous:d.previous, pages:d.pages, signedOn:null};
  const ready = S.gateName.trim() && S.gateChk;
  const total = docTotal(c, done);
  return `<div class="gatehead">
      <h3>${esc(d.title)}</h3>
      ${/* No explainer on the platform card. The scrim behind it already shows the portal is
             out of reach, and the contract's own opening line says who it binds — so a paragraph
             saying both was telling the agent what they can already see.
             The project card keeps its copy, because what it says is not visible anywhere: that
             the rest of the portal still works and that switching projects is an option. */''}
      ${/* A renewal has one more thing to explain than a new contract does, and it is the thing
             the agent will otherwise get wrong: this is the document they already signed, it has
             not changed, and it is the signature rather than the terms that ran out. */''}
      ${platform?''
        : isResign(d)
        ? `<p>You signed this contract on <b>${fmt(d.signedOn)}</b>. ${renewalWhy(d)} Nothing in the
             document has changed — sign it again before you can work on this project or open its
             dashboard, insights or coaching. Everything else in the portal still works, and you
             can switch projects above.</p>`
        : `<p>${esc(d.project)} has added this contract. Sign it before you can work on
           this project or open its dashboard, insights or coaching. Everything else in the portal
           still works, and you can switch projects above.</p>`}
    </div>
    <div class="gatebody">
      <div class="paperframe"><div class="paperpg">${projectPaper(S.gatePage, info, c)}</div></div>
      <div class="pager">
        <button class="pgb" ${S.gatePage===1?'disabled':''} onclick="S.gatePage=${S.gatePage-1};render()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="11 6 5 12 11 18"/></svg>Prev</button>
        ${Array.from({length:total},(_,i)=>i+1).map(n=>
          `<button class="pgn ${n===S.gatePage?'on':''}" onclick="S.gatePage=${n};render()">${n}</button>`).join('')}
        <button class="pgb" ${S.gatePage===total?'disabled':''} onclick="S.gatePage=${S.gatePage+1};render()">Next
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="13 6 19 12 13 18"/></svg></button>
      </div>
      <div class="sigsec">
        <h3>Contractor Signature</h3>
        <div class="fld"><label for="gfn">Full name</label>
          <input type="text" id="gfn" autocomplete="off" ${done?'disabled':''}
                 value="${done?'Olivia O.J Rhye':esc(S.gateName)}"
                 oninput="S.gateName=this.value;syncGate()"></div>
        <div class="chkrow">
          <input type="checkbox" id="gck" ${done||S.gateChk?'checked':''} ${done?'disabled':''}
                 onchange="S.gateChk=this.checked;syncGate()">
          <label for="gck">I have read and accepted the ${esc(d.title)}.</label>
        </div>
      </div>
    </div>
    <div class="gatefoot">
      ${/* Name the list it goes back to. "All contracts" is a promise this button cannot keep —
           the list behind it is only the contracts blocking this one thing. "Back" would be
           accurate but inside a modal it reads as "close", which is the one exit the gate has
           not got. */''}
      ${fromList?`<button class="lnk" onclick="backToQueue()">← All ${platform?'platform':esc(d.project)} contracts</button>`:''}
      ${/* Log out lives on the contract LIST, which is one click back. Repeating it here made
           three links sit side by side under the signature. It stays on a single-contract gate,
           where there is no list to go back to and losing it would leave no way out at all. */''}
      ${platform&&!fromList?`<button class="lnk" onclick="toast('Would log you out')">Log out</button>`:''}
      ${platform?`<button class="lnk" onclick="toast('Would open support')">Contact support</button>`:''}
      <div class="sp"></div>
      ${done ? `<span class="signedline">Signed ${fmt(d.signedOn)}</span>`
             : `<button class="btn pri sq" id="gbtn" ${ready?'':'disabled'} onclick="acceptGate()">Submit</button>`}
    </div>`;
}
function gateHTML(){
  if(!platformBlocked()) return '';
  return `<div class="gatescrim"><div class="gatemodal">${gateContent()}</div></div>`;
}
function syncGate(){
  const b=document.getElementById('gbtn');
  if(b) b.disabled = !(S.gateName.trim() && S.gateChk);
}
function acceptGate(){
  if(!(S.gateName.trim() && S.gateChk)) return;
  const d = gateDoc(); if(!d || d.signed) return;
  d.signed=true; d.signedOn=addDays(TODAY,0);
  if(!d.project && !platformBlocked()) S.platform='signed';
  S.gatePick=null; S.gateList=false; S.gateName=''; S.gateChk=false; S.gatePage=1;
  /* Last mandatory platform contract signed, background check still to do: carry the agent
     straight on to it, as the old Legal-tab flow did. It is not blocking — they can leave. */
  if(!d.project && !platformBlocked() && !BGC().signed){
    openBgc(true);
    return toast(`Successfully signed ${esc(d.title)}.`);
  }
  render();
  /* Say where it went — the gate replaced the trip through Settings that used to teach this. */
  toast(d.project ? 'Signed. Your copy, with its contract details page, is in Settings → Legal.'
                   : 'Signed. You can read it any time in Settings → Legal.');
}
/* Signing a project contract happens in that project's dashboard, because that is the thing
   being unblocked. */
function openProjectDash(id){
  S.view='dash'; S.dashProject=id; S.dashSel=false;
  S.gatePick=null; S.gateList=false; S.gateName=''; S.gateChk=false; S.gatePage=1;
  closeScrim(); render();
}

/* ============================================================
   PLUMBING
   ============================================================ */
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function scrim(html){
  const o=document.getElementById('overlay');
  o.innerHTML=`<div class="scrim" onclick="closeScrim()">${html}</div>`;
  const m=o.querySelector('.scrim>*'); if(m) m.onclick=e=>e.stopPropagation();
}
function closeScrim(){ S.openProject=null; document.getElementById('overlay').innerHTML=''; }
function toast(msg){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),4000);
}
function go(v){ S.view=v; closeAcct(); closeScrim(); render(); }
/* Redraw the page and, if a project modal is open, the modal too — so flipping a control
   updates what you are looking at instead of throwing it away. */
function refresh(){
  render();
  if(S.openProject && document.querySelector('#overlay .modal[data-m="project"]')) drawProject();
}
/* Full wipe, only from the Reset button. */
function resetAll(){
  S.docs={sow:false,nda:false}; S.docsOn={}; S.applied=[];
  S.gigReqs=false; S.guideCol=false;
  S.sub='joined'; S.sort='new'; S.page=1; S.tab='available'; S.view='home';
  S.docKey='ica'; S.docVersion=null; S.signName=''; S.signChk=false;
  S.taskOpen=false; S.workProject=null;
  const b = BGC(); b.signed = S.existing; b.signedOn = S.existing ? '2025-02-03' : null;
  Object.assign(S, {bgcStep:1, bgcAgree:false, bgcAns:{}, bgcConfirm:false, bgcFromGate:false, bgcView:false, bgcSaved:null});
  applyDue(); closeScrim(); render();
}
/* Which client contracts the client has re-issued and not yet been accepted. */
function applyDue(){
  const map = {none:[], p1:['rv-sow'], same:['rv-sow','rv-nda'], two:['rv-sow','qa-dha'],
               /* A renewal falling due. Same machinery as a re-issue — the document simply goes
                  back to unsigned — which is the whole point: nothing new is built for it. */
               renew:['rv-ica']};
  const unsigned = map[S.due] || [];
  ['rv-sow','rv-nda','qa-dha','rv-ica'].forEach(id=>{
    const d = PROJECTDOCS.find(x=>x.id===id);
    d.reissued = unsigned.includes(id);
    d.signed   = !unsigned.includes(id);
    /* Only a contract carrying a re-signing schedule can expire. Everything else that turns up
       unsigned is a contract the client has just added. */
    d.resign   = !!(d.renewMonths && d.reissued);
    if(d.signed) d.signedOn = d.signedOn || addDays(TODAY,0);
  });
}
function setDue(v){ S.due=v; applyDue(); refresh(); }
function setPlatform(v){
  S.platform=v;
  const unsigned = v==='one' ? ['ica'] : v==='two' ? ['ica','dpa'] : [];
  PLATFORMDOCS.filter(d=>!d.step).forEach(d=>{
    d.reissued = unsigned.includes(d.id);
    d.signed   = !unsigned.includes(d.id);
    if(d.signed && !d.signedOn) d.signedOn = '2025-02-03';
  });
  S.gatePick=null; S.gateList=false; S.gateName=''; S.gateChk=false; S.gatePage=1;
  refresh();
}
function stripHTML(){
  return `<div class="strip">
    <span class="sl">Agent</span>
    <span class="segwrap">
      <button class="sb ${S.existing?'':'on'}" onclick="setAgent('new')">New</button>
      <button class="sb ${S.existing?'on':''}" onclick="setAgent('existing')">Existing</button>
    </span>
    <span class="sl">Platform contract</span>
    <span class="segwrap">${[['signed','Signed'],['one','1 unsigned'],['two','2 unsigned']].map(([k,l])=>
      `<button class="sb ${S.platform===k?'on':''}" onclick="setPlatform('${k}')">${l}</button>`).join('')}</span>
    <span class="sl">Project contracts</span>
    <span class="segwrap">${[['none','None'],['p1','1'],['same','2 in one'],['two','2 in two'],
                             ['renew','Renewal due']].map(([k,l])=>
      `<button class="sb ${S.due===k?'on':''}" onclick="setDue('${k}')">${l}</button>`).join('')}</span>
    <span class="sl">Agent country</span>
    <span class="segwrap">${[['vn','Vietnam'],['my','Malaysia'],['es','Spain']].map(([k,l])=>
      `<button class="sb ${S.country===k?'on':''}" onclick="setCountry('${k}')">${l}</button>`).join('')}</span>
    <button class="pb ${S.bankTax?'':'act'}" onclick="toggleBankTax()">Bank &amp; tax: ${S.bankTax?'filled':'missing'}</button>
    <button class="pb" onclick="resetAll()">Reset</button>
  </div>`;
}



/* Flipping a prerequisite has to redraw whatever project modal is already open, or the
   footer keeps showing the old verdict. */
function completeGigReqs(){ S.gigReqs=true; render(); toast('Gig Requirements complete.'); }
function setAgent(kind){
  S.existing = kind==='existing';
  /* An existing agent did their background check long ago; a new one has it still to do. */
  const b = BGC(); b.signed = S.existing; b.signedOn = S.existing ? '2025-02-03' : null;
  if(S.view==='bgc' && S.existing) S.view='legal';
  refresh();
}
function toggleBankTax(){ S.bankTax=!S.bankTax; refresh(); }
/* Where the floating widget shows — same rules as the current-scope prototype, plus:
   · the background-check steps count as Legal (already looking at it);
   · "only contracts outstanding" replaces "bank & tax filled", because a new agent's widget also
     carries setup items (background check, Gig Requirements) that no banner covers. */
const onlyContractsLeft = () => guideItems().filter(i=>!i.done).every(i=>i.contract);
/* ⚠ WHEN THE FLOATING WIDGET SHIPS — banner vs widget (decided 30 Sep 2026)
   The widget is NOT in the current sprint; the "Action required" banner is. Once the widget is
   built, REMOVE the banner from Earnings. Rule: one reminder per screen —
     · banner  = "this page is affected" → only where something is locked (project Dashboard,
                 Insights, Coaching: Handle Contacts + table disabled);
     · widget  = "your to-do list"       → portal-wide pages (Home, Earnings, Referrals, Schedule).
   Earnings only has the banner now because the widget isn't built and the "earnings on hold"
   note was dropped (devs can't hold earnings). Rejected alternative: keep both on Earnings and
   strip contract items from the widget there — two reminder styles on one page, and a widget
   whose list changes per page. See decisions-log.md in this folder. */
function widgetHidden(){
  if(platformBlocked()) return true;                                 // portal sealed
  if(S.view==='legal' || S.view==='doc' || S.view==='bgc') return true; // already in Legal
  if(PROJPAGES[S.view]) return true;                                 // project banner speaks
  /* Earnings carries the same Action required banner — don't say it twice. */
  if(S.view==='wallet' && PROJECTDOCS.some(d=>!d.signed) && onlyContractsLeft()) return true;
  if(S.view==='schedule' && S.schProj){
    /* Filtered to one project: show only if that project is waiting on a signature, or if
       there is account-level business, which is in scope regardless. */
    const p = JOINED.find(x=>x.id===S.schProj);
    if(p && !projLocked(p.name) && onlyContractsLeft()) return true;
  }
  return false;
}
function render(){
  document.getElementById('gate').innerHTML  = gateHTML();
  document.getElementById('rail').innerHTML  = railHTML();
  document.getElementById('view').innerHTML  =
      S.view==='home' ? homeHTML()
      : S.view==='wallet' ? walletHTML()
      : S.view==='referrals' ? referralsHTML()
      : S.view==='schedule' ? scheduleHTML()
      : PROJPAGES[S.view] ? projPage(S.view)
      : S.view==='work' ? workHTML()
      : S.view==='doc' ? docHTML()
      : S.view==='bgc' ? bgcHTML() : legalHTML();
  const wh = widgetHidden();
  document.getElementById('guide').innerHTML = wh ? '' : guideHTML();
  document.body.classList.toggle('haswidget', !wh && !!guideItems().filter(i=>!i.done).length);
  document.body.classList.toggle('sched', S.view==='schedule');  // schedule grid needs footer room
  /* Locked project page (PO, 2 Oct): the content stays visible, but the controls inside the page
     are disabled too — Insights' metric tabs and period selector, the leaderboard period,
     Coaching's date/filters, the Dashboard's sub-tabs. The project switcher and the banner's
     Review & sign stay live. */
  const lp = PROJPAGES[S.view] && JOINED.find(x=>x.id===S.dashProject);
  if(lp && projLocked(lp.name))
    document.querySelectorAll('#view .subtab, #view .selpill, #view .lockable').forEach(b=>{ b.disabled=true; b.removeAttribute('onclick'); });
  document.getElementById('strip').innerHTML = stripHTML();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape' && !platformBlocked())closeScrim();});
/* Reconcile the seeded contracts with whatever the Due control defaults to, so the widget
   and the toolbar never disagree at startup. */
applyDue();
render();
</script>
