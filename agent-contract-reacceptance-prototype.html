<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Portal — contract re-acceptance prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{
  --ink:#16263c; --ink2:#4a5a71; --ink3:#78879a;
  --panel:#fff; --line:#e8eef1; --line2:#dbe4ea;
  --teal:#0a9d78; --teal-d:#087c5f; --teal-s:#e6f7f0; --teal-ink:#0a7358;
  --amber:#a85a08; --amber-s:#fdf4e7; --amber-line:#f2dcb6;
  --red:#c53b3b; --red-s:#fdf1f1;
  --od:#c2620a; --od-s:#fdf0e0;          /* overdue — always orange, never red */
  --rail-on:#e2f6ee;
  --sh:0 1px 2px rgba(16,30,50,.05);
  --sh-md:0 4px 16px rgba(16,30,50,.08);
  --sh-lg:0 18px 50px rgba(16,30,50,.18),0 3px 8px rgba(16,30,50,.06);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
  background:linear-gradient(160deg,#e6f1f4 0%,#eef5f7 30%,#f6f9fa 70%);
  background-attachment:fixed;min-height:100vh;
  font:14.5px/1.55 var(--font);
  -webkit-font-smoothing:antialiased}
/* One family for the whole prototype, including form controls, which otherwise
   fall back to the OS UI font. */
button,input,select,textarea,optgroup{font-family:var(--font)}
button{font-size:inherit;cursor:pointer}
input,select{font-size:inherit;color:var(--ink)}
a{color:var(--teal);text-decoration:none}

.app{min-height:100vh}

/* ---------- left nav: matches the Figma "Sidebar navigation – Slim" spec ----------
   82px at rest, 232px on hover. The 82px column stays reserved, so the expanded panel
   overlays the page instead of shoving it sideways. */
.rail{position:fixed;left:0;top:0;bottom:0;width:82px;background:#fff;border-right:1px solid #E4E7EC;
  z-index:80;overflow:hidden;transition:width .18s ease}
.rail:is(:hover,.pin){width:232px;box-shadow:0 12px 26px -8px rgba(16,24,40,.13)}
.railin{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-top:32px}
.rnav{display:flex;flex-direction:column;gap:24px}
.rlogo{display:flex;align-items:center;gap:9px;padding:0 16px 12px;justify-content:center}
.rail:is(:hover,.pin) .rlogo{justify-content:flex-start;padding-left:24px;padding-right:20px}
.mark{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;flex-shrink:0}
.mark i{display:block;border-radius:50%;background:#00D0A3}
/* display:none, not opacity:0 — an invisible label still occupies width, which pushed the
   logo mark off the icon centre line. */
.word{font-size:14px;font-weight:700;line-height:1.05;color:#101828;white-space:nowrap;letter-spacing:-.01em;
  display:none}
.rail:is(:hover,.pin) .word{display:block}
.rgroup{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.rgroup.tight{gap:4px}
.ritem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;background:#fff;
  border:0;width:100%;color:#667085;white-space:nowrap;text-align:left}
.ritem svg{width:24px;height:24px;flex-shrink:0}
.ritem b{font-size:16px;font-weight:500;color:#344054;opacity:0;transition:opacity .14s}
.rail:is(:hover,.pin) .ritem b{opacity:1}
.ritem:hover{background:#F4FDFA}
.ritem.on{background:#E9FEF9;color:#007460}
.ritem.on b{color:#00574F}
.rfoot{display:flex;flex-direction:column;gap:24px;padding-bottom:28px}
.rdiv{height:1px;background:#E4E7EC;margin:0 16px}
/* 16px puts the 48px avatar's centre on the same 40px axis as the 24px nav icons. */
/* Decoration only — the account menu is opened from the Settings item. */
.racct{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;cursor:default}
.rail:is(:hover,.pin) .racct{padding:0 8px}
.rav{width:48px;height:48px;border-radius:50%;flex-shrink:0;border:1px solid #E4E7EC;
  background:#dfe7ed url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2398a9b8"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6z"/></svg>') center/30px no-repeat}
.racct b{font-size:14px;line-height:20px;font-weight:500;color:#101828;white-space:nowrap;
  opacity:0;transition:opacity .14s}
.rail:is(:hover,.pin) .racct b{opacity:1}

/* account submenu — floats clear of the rail so it works in either width */
.rsub{position:fixed;z-index:95;background:#fff;border-radius:8px;padding:8px;display:flex;
  flex-direction:column;gap:4px;min-width:214px;
  box-shadow:0 4px 6px -2px rgba(16,24,40,.05),0 12px 16px -4px rgba(16,24,40,.10)}
.rsub .ritem b{opacity:1}
.rsub .ritem.danger{color:#F97066}
.rsub .ritem.danger b{color:#F04438}

/* ---------- main ---------- */
.main{padding:30px 34px 90px;min-width:0;margin-left:82px}
/* The floating widget can cover the last rows of a long page (the schedule's small hours), so the
   schedule gets extra footer room while the widget is showing. */
body.haswidget.sched .main{padding-bottom:330px}
.wrap{max-width:1180px;margin:0 auto}
h1.hi{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:0 0 20px}

.toprow{display:grid;grid-template-columns:376px minmax(0,1fr);gap:20px;margin-bottom:34px;align-items:start}
@media(max-width:980px){.toprow{grid-template-columns:1fr}}

/* ---------- setup guide: a small persistent card, not a page block ----------
   Anchored bottom-right so it never competes with the page for the top of the screen,
   and so it can appear or disappear without the layout moving underneath it. */
.guide{position:fixed;right:20px;bottom:76px;z-index:60;width:300px;background:#fff;border-radius:16px;
  padding:13px 13px 11px;border:1px solid rgba(10,157,120,.18);
  box-shadow:0 14px 36px rgba(16,30,50,.17),0 2px 6px rgba(16,30,50,.06)}
.ghead{display:flex;align-items:center;gap:8px}
.ghead h2{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;white-space:nowrap}
.gcount{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;background:#F2F4F7;
  color:#344054;white-space:nowrap}
.gtog{border:0;background:transparent;color:var(--ink3);padding:3px;border-radius:6px;display:grid;place-items:center}
.gtog:hover{background:#f1f5f7;color:var(--ink2)}
.gtog svg{width:15px;height:15px;transition:transform .18s}
.guide.col .gtog svg{transform:rotate(180deg)}
.gbar{height:5px;border-radius:99px;background:#eef2f5;overflow:hidden;margin:11px 0 9px}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f46e5,#6366f1);transition:width .4s}
.glist{background:#f8fafb;border:1px solid var(--line);border-radius:11px;padding:4px;margin-top:10px}
/* The whole row is the target, so there is no separate Open button competing with the
   label for horizontal space — which is what forced the text onto a third line. */
.gitem{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-radius:9px;width:100%;
  text-align:left;border:1px solid transparent;background:transparent;color:inherit;font:inherit}
.gitem+.gitem{margin-top:2px}
.gitem.act{cursor:pointer}
.gitem.act:hover{background:#eef2f5}
/* Contract rows only. Amber, not red: this is something to do, not something that has gone
   wrong — and it is the same amber the gates and the project modal already use, so the agent
   meets one colour for "a contract is waiting" wherever they run into it. */
/* Fill and dot only — no border. The base .gitem keeps its 1px transparent border either way,
   so the row does not shift by a pixel when it changes type. */
.gitem.ctr{background:#fdf6e4}
.gitem.ctr.act:hover{background:#fbe6ad}
.gitem.ctr .dot{border-color:#f79009}
.gitem.ctr .lbl{color:var(--ink)}
.gitem .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  border:1.8px solid var(--teal);background:#fff;margin-top:2px}
.gitem .dot svg{width:9px;height:9px;color:#fff}
.gitem.done .dot{background:var(--teal);border-color:var(--teal)}
/* Label and its deadline stack, so the label gets the card's full width for 1–2 lines. */
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.gitem .lbl{font-size:13.5px;font-weight:400;line-height:1.4}
.gitem.done .lbl{color:var(--ink2)}
/* Every row looks the same, in both widgets. The deadline badge carries the urgency, so the
   row itself does not need to shout as well. */
/* Filled only — no outlined badges in the design system. multiply is a no-op on white. */
.due{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;
  background:#F2F4F7;color:#344054;mix-blend-mode:multiply}
.due.late{background:var(--od-s);color:var(--od)}
.gfoot{font-size:12px;color:var(--ink3);padding:10px 3px 1px;line-height:1.45}
.guide.col{width:auto;padding:9px 11px}
.guide.col .gbar,.guide.col .glist,.guide.col .gfoot{display:none}
.allset{position:fixed;right:20px;bottom:76px;z-index:60;background:#fff;border-radius:99px;
  padding:9px 15px 9px 11px;display:flex;gap:9px;align-items:center;font-size:13px;
  border:1px solid rgba(10,157,120,.18);box-shadow:0 10px 28px rgba(16,30,50,.14)}
.allset .tick{width:20px;height:20px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex-shrink:0}

/* ---------- tier card ---------- */
.tier{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--sh-md);min-height:150px;
  display:flex;flex-direction:column;justify-content:center}
.tier .badge{display:inline-flex;align-items:center;gap:7px;background:#14273d;color:#fff;font-size:12.5px;
  font-weight:700;padding:6px 13px;border-radius:99px;width:fit-content;margin-bottom:11px}
.tier p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.tier p b{color:var(--ink)}

/* ---------- hero banner ---------- */
.hero{border-radius:18px;padding:26px 28px;min-height:150px;
  background:linear-gradient(115deg,#f4e7fb 0%,#e9e7fd 45%,#dfe9fd 100%);
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh)}
.hero h3{margin:0 0 5px;font-size:24px;font-weight:700;color:#4338ca;letter-spacing:-.02em}
.hero p{margin:0;font-size:14.5px;color:#5b5f86;max-width:44ch}

/* ---------- projects ---------- */
.psec h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.psechead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.psechead .sp{flex:1}
.segs{display:flex;gap:4px;background:#fff;border-radius:11px;padding:4px;box-shadow:var(--sh)}
.seg{border:0;background:transparent;padding:8px 15px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink3)}
.seg:hover{color:var(--ink2)}
.seg.on{background:var(--teal-s);color:var(--teal-ink)}

.pcard{background:#fff;border-radius:18px;padding:24px 26px 26px;box-shadow:var(--sh-md)}
.pcardhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pcardhead b{font-size:19px;font-weight:700;letter-spacing:-.015em}
.pcardhead .ct{font-size:16px;color:var(--ink2);font-weight:500}
.pcardhead .dash{font-size:15px;color:var(--ink3)}
.pcardhead .sp{flex:1}
.sortwrap{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);white-space:nowrap}
.sortwrap select{padding:9px 34px 9px 13px;border:1px solid var(--line2);border-radius:11px;background:#fff;
  font-size:14px;font-weight:500;appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%234a5a71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;background-position:right 11px center;background-size:14px}
.sortwrap select:focus{outline:2px solid var(--teal-s);border-color:var(--teal)}

.subtabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:18px 0 22px}
.subtab{border:0;background:transparent;padding:0 0 12px;font-size:14.5px;font-weight:600;color:var(--ink3);
  border-bottom:2.5px solid transparent;margin-bottom:-1px}
.subtab:hover{color:var(--ink2)}
.subtab.on{color:var(--teal-ink);border-bottom-color:var(--teal)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:22px}
.proj{border:1px solid #eef2f5;border-radius:14px;overflow:hidden;background:#f7f9fb;text-align:left;
  padding:0;width:100%;transition:.14s}
/* Lift only. Recolouring the card on hover read as a state change rather than a pointer cue. */
.proj:hover{box-shadow:0 6px 20px rgba(16,30,50,.11)}
.projtop{display:flex;align-items:flex-start;gap:11px;padding:16px 16px 14px}
.projtop .ic{width:28px;height:28px;border-radius:50%;background:#3d4c60;color:#fff;display:grid;
  place-items:center;flex-shrink:0;margin-top:1px}
.projtop .ic svg{width:15px;height:15px}
.projtop b{flex:1;font-size:15.5px;font-weight:700;line-height:1.32}
.projtop .car{color:var(--ink3);font-size:17px;line-height:1;margin-top:4px}
.projlock{display:flex;align-items:center;gap:8px;margin:0 15px 12px;padding:6px 10px;border-radius:8px;
  background:var(--od-s);color:var(--od);font-size:12.5px;font-weight:600}
.projlock svg{width:13px;height:13px;flex:none}
.prow{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid #e6ecf0;font-size:13.5px}
.prow .k{color:var(--ink2)}
.prow .v{font-weight:600;text-align:right;white-space:nowrap}
.stars{color:#f0b429;letter-spacing:1.5px;font-size:12px}
.stars .dim{color:#dbe2e8}
.flags{font-size:13px;font-weight:500}

.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.pgb{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:9px 18px;font-size:14px;
  font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.pgb:hover:not(:disabled){background:#f5f8f9}
.pgb:disabled{color:#c6ced6;cursor:not-allowed}
.pgn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:14px;
  font-weight:600;color:var(--ink2)}
.pgn:hover{background:#f2f5f8}
.pgn.on{background:var(--teal-s);color:var(--teal-ink)}
.pempty{padding:44px 16px;text-align:center;color:var(--ink3);font-size:14px}
.dashgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media(max-width:1180px){.dashgrid{grid-template-columns:1fr}.dashside{display:none}}
.dashside{border-radius:18px;overflow:hidden;min-height:640px;padding:20px;display:flex;

.sidecard{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:var(--sh-md)}
.sidecard b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sidecard .sl2{font-size:13px;color:var(--ink2);margin-top:2px}
.sidecard .ms{font-size:12px;color:var(--ink3);margin-top:6px}
.dashhead{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.dashhead .sp{flex:1}
.dashsel{border:0;background:transparent;font-size:24px;font-weight:700;letter-spacing:-.02em;
  color:var(--ink);display:inline-flex;align-items:center;gap:10px;padding:4px 8px;border-radius:10px}
.dashsel:hover{background:#eef3f6}
.dashsel svg{width:19px;height:19px;color:var(--ink3)}
.dashmenu{position:absolute;top:100%;left:0;z-index:70;background:#fff;border-radius:12px;padding:6px;
  min-width:340px;box-shadow:0 4px 6px -2px rgba(16,24,40,.05),0 12px 16px -4px rgba(16,24,40,.10);
  display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
.dashopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;
  padding:10px 12px;border-radius:9px;font-size:14.5px;color:var(--ink)}
.dashopt:hover{background:#f2f6f9}
.dashopt span:first-child{flex:1}
.lockchip{display:inline-flex;align-items:center;gap:6px;background:var(--od-s);color:var(--od);
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.lockchip svg{width:12px;height:12px;flex:none}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.metric{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--sh-md)}
.metric b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block}
.metric .ml{font-size:14px;color:var(--ink2);margin-top:2px}
.metric .ms{font-size:12.5px;color:var(--ink3);margin-top:8px}
.dashtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.dashtbl th{text-align:left;font-weight:600;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--line)}
.dashtbl td{padding:12px;border-bottom:1px solid var(--line)}
.dashtbl tr:last-child td{border-bottom:0}
.dashgrid.solo{grid-template-columns:minmax(0,1fr)}
.secttl{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px}
.chartkey{display:flex;gap:18px;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.chartkey span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:7px}
.chartkey .k1::before{background:#2e90fa}.chartkey .k2::before{background:#d444a6}
.chartkey .k3::before{background:#6172f3}
.chartph{border-radius:12px;background:linear-gradient(180deg,#fbfdff,#f4f8fb);padding:14px 8px 8px}
.chartph svg{display:block;width:100%;height:190px}
.chartx{display:flex;justify-content:space-between;padding:8px 4px 2px;font-size:11.5px;color:var(--ink3)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.cpanel{background:#fafbfe;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.cph{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);margin-bottom:10px}
.crow{display:flex;align-items:center;gap:16px;padding:10px 0;font-size:13.5px;
  border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .sp{flex:1}
.crow.chd{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.cdot{width:13px;height:13px;border-radius:99px;flex:none}
.cdot.ok{background:#12b76a}.cdot.warn{background:#f79009}.cdot.bad{background:#f04438}
.cbig{padding:12px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cbig b{font-size:32px;font-weight:700;letter-spacing:-.02em}
.cdelta{font-size:12px;font-weight:600;color:#12b76a;margin-left:10px}
.cdot.sm{width:9px;height:9px}
.chartkey .k4::before{background:#c3cdd8}
.cardhd{display:flex;align-items:center;gap:14px;margin:4px 0 10px;flex-wrap:wrap}
.cardhd .sp{flex:1}
.selpill{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 13px;
  font-size:13.5px;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.selpill:hover{background:#f7fafc}
.selpill svg{width:15px;height:15px;color:var(--ink3);flex:none}
/* ---------- insights rail ---------- */
/* overflow:visible — with no padding, the rounded-card clipping cut the left edge of the
   bold "R" in the Reliability Metrics title. */
.dashside.plain{background:none;min-height:0;padding:0;overflow:visible}
.railttl{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;display:flex;
  flex-direction:column}
.railttl .ms{font-size:12px;color:var(--ink3);font-weight:400;margin-top:4px}
.relcard{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--sh-md)}
.relhd{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink2);margin-bottom:12px}
.relhd svg{width:16px;height:16px;flex:none}
.relbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.relpill{font-size:26px;font-weight:700;padding:5px 16px;border-radius:12px;letter-spacing:-.02em}
.relpill.good{background:#e7f8f1;color:#0a7a5c}
.relpill.bad{background:#fdeceb;color:#c8372a}
.relstar{font-size:11px;font-weight:700;color:#b45309}
.relsub{font-size:12px;color:var(--ink3);margin-top:10px}
.relsub b{color:var(--ink2);font-weight:600}
/* ---------- average handle time ---------- */
.ahtgrid{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;margin-top:22px;
  align-items:stretch}
@media(max-width:1000px){.ahtgrid{grid-template-columns:1fr}}
.ahtcard{border-radius:18px;padding:22px 20px;color:#fff;display:flex;flex-direction:column;gap:20px;
  background:linear-gradient(158deg,#12a596,#0b7a83 58%,#0e5f77)}
.ahtcard .n{font-size:27px;font-weight:700;letter-spacing:-.02em;display:block}
.ahtcard .l{font-size:12.5px;opacity:.88;margin-top:3px;display:flex;align-items:center;gap:6px}
.ahtcard .l svg{width:14px;height:14px}
.ahtcard .goal{background:rgba(255,255,255,.17);border-radius:14px;padding:13px 15px;margin-top:auto}
.ahttbl{width:100%;border-collapse:collapse;font-size:13px}
.ahttbl th{font-weight:600;color:var(--ink2);text-align:center;padding:8px;font-size:12px;
  line-height:1.35;vertical-align:bottom}
.ahttbl th:first-child{text-align:left;width:34%}
.ahttbl td{padding:13px 8px;text-align:center;border-top:1px solid var(--line);
  font-size:17px;font-weight:700;letter-spacing:-.02em}
.ahttbl td:first-child{text-align:left}
.ahttbl .u{font-size:11px;font-weight:500;color:var(--ink3);display:block;margin-top:1px}
.ahttbl .lo{color:#c8372a}.ahttbl .hi{color:#0a7a5c}
.ahtwho{display:flex;align-items:center;gap:10px;color:var(--ink)}
.ahtwho svg{width:22px;height:22px;color:var(--ink3);flex:none}
.ahtwho b{font-size:15px;font-weight:700;display:block}
.ahtwho i{font-size:12px;font-style:normal;color:var(--ink3);font-weight:400}
/* ---------- leaderboard ---------- */
.lbchip{background:#eef4ff;color:#3538cd;font-size:12.5px;font-weight:600;padding:5px 11px;
  border-radius:99px}
.rank{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:#eef4ff;
  font-size:12.5px;font-weight:700;color:#3538cd}
.lbname{display:flex;align-items:center;gap:9px;font-weight:600}
.lbname .av{width:24px;height:24px;border-radius:99px;background:#e8eef1;color:var(--ink2);
  font-size:9.5px;font-weight:700;display:grid;place-items:center;flex:none}
.mchip{display:inline-block;background:#F2F4F7;color:#344054;font-size:11px;padding:3px 8px;
  border-radius:6px;margin:4px 5px 0 0}
/* ---------- coaching feedback ---------- */
.fbbanner{margin-top:22px;border-radius:18px 18px 0 0;padding:20px 26px 44px;
  background:linear-gradient(99deg,#19b9ab 4%,#5a6ee6 58%,#63aee8 100%)}
.fbbanner h3{margin:0;font-size:20px;font-weight:700;color:#0d2b3c;letter-spacing:-.02em}
.pcard.fbcard{margin-top:-26px;border-radius:18px}
.filtbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.fbcount{font-size:12.5px;color:var(--ink3);margin:14px 0 2px}
.dashtbl tr.sel td{background:var(--teal-s)}
.fbdot{width:17px;height:17px;border-radius:99px;background:#12b76a;color:#fff;font-size:11px;
  font-weight:700;display:grid;place-items:center}
.fbmeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.fbtile{border:1px solid var(--line2);border-radius:12px;padding:9px 15px;min-width:140px}
.fbtile .l{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.fbtile .l svg{width:13px;height:13px}
.fbtile b{font-size:14px;font-weight:600;display:block;margin-top:3px}
.fbids{font-size:12.5px;color:var(--ink3);line-height:1.7}
.fbids b{color:var(--ink);font-weight:600}
.fbgrid{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:22px}
@media(max-width:1000px){.fbgrid{grid-template-columns:1fr}}
.fbhd{display:flex;align-items:center}
.fbhd .sp{flex:1}
.fbtag{display:inline-block;background:#F2F4F7;color:#344054;font-size:10.5px;font-weight:700;
  letter-spacing:.06em;padding:3px 8px;border-radius:5px}
.fbnote{font-size:13.5px;line-height:1.62;color:var(--ink2);margin:9px 0 20px}
.worknow{display:flex;align-items:center;gap:14px;border:1px solid #bfe6d7;background:var(--teal-s);
  border-radius:12px;padding:15px 18px}
.worknow b{font-size:15px}
.worknow .meta{font-size:13px;color:var(--teal-ink);margin-top:2px}
.worknow .sp{flex:1}
.workclean{font-size:12.5px;color:var(--ink3);margin:16px 2px 0;max-width:70ch}
.workfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);
  margin-top:22px;padding-top:20px}

.notice{margin-bottom:20px;background:var(--teal-s);border:1px solid #bfe6d7;border-radius:11px;
  padding:12px 15px;font-size:13.5px;color:var(--teal-ink);display:flex;gap:9px;align-items:flex-start}
.notice svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}

/* ---------- settings / legal ---------- */
.sheet{background:#fff;border-radius:20px;padding:30px 34px 40px;box-shadow:var(--sh-md)}
.sheet h1{font-size:26px;font-weight:700;margin:0 0 22px;letter-spacing:-.02em}
.setgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:0}
@media(max-width:840px){.setgrid{grid-template-columns:1fr}}
.setnav{border-right:1px solid var(--line);padding-right:18px;display:flex;flex-direction:column;gap:2px}
.setnav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;
  font-size:14.5px;color:var(--ink2);display:flex;align-items:center}
.setnav button:hover{background:#f4f7f9;color:var(--ink)}
.setnav button.on{background:var(--teal-s);color:var(--teal-ink);font-weight:600}
.setbody{padding-left:28px}
.setbody h2{font-size:20px;font-weight:700;margin:0 0 22px;letter-spacing:-.015em}
.setbody h3{font-size:16.5px;font-weight:700;margin:0 0 13px}
.docgroup{margin-bottom:30px}
/* Renamed from .proj — it collided with the project-card selector, so hovering this group
   picked up the card's lift. */
/* One light card per project, so the grey does the separating. */
.projgrp{background:#f7f9fb;border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;
  margin-bottom:14px}
.projgrp:last-child{margin-bottom:0}
.projgrp-nm{font-size:14.5px;font-weight:700;margin-bottom:12px}
.projgrp .docrow{margin-bottom:10px}
.projgrp .prev{margin:-2px 0 12px 2px}
/* The version list belongs to the tile above it, so the gap inside the pair has to be smaller
   than the gap to the next document — otherwise the rows read as a separate block that happens
   to sit underneath. The negative margin eats most of the tile's own margin-bottom; the space
   between documents is set by the margin-top on each following tile. */
.vlist{margin:-6px 0 0;padding:0 16px}
.vrow{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:13.5px;color:var(--ink2);
  border-bottom:1px solid var(--line)}
.vrow:first-child{padding-top:5px}
.vrow:last-child{border-bottom:0}
.vrow b{color:var(--ink);font-weight:600}
.vrow .sp{flex:1}
.vrow a{color:var(--teal);font-weight:600;white-space:nowrap}
.vrow a:hover{text-decoration:underline}
.docrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:11px;
  padding:13px 16px;margin-bottom:11px;background:#fff}
.docrow.act{border-color:#bfe3d6}
.docrow .nm{flex:1;min-width:0}
.docrow .nm b{display:block;font-size:14.5px;font-weight:600}
.docrow .meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.tag{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap}
.tag.need{background:var(--amber-s);color:var(--amber)}
.tag.ok{background:var(--teal-s);color:var(--teal-ink)}
/* Once signed, the useful fact is when — not that it happened. Same pill metrics as the
   "Needs signature" tag, so signed and unsigned rows line up. */
.signedon{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
  color:#00574F;background:#E9FEF9;border-radius:99px;padding:5px 13px;
  white-space:nowrap;flex-shrink:0}
.signedon svg{width:12px;height:12px;flex:none;color:#0BB98A}
.tag.miss{background:var(--amber-s);color:var(--amber)}
.docrow .sign{border:1px solid var(--teal);background:#fff;color:var(--teal-ink);font-weight:600;
  font-size:13px;padding:7px 13px;border-radius:8px}
.docrow .sign:hover{background:var(--teal-s)}
/* the whole tile is the target now, so there is no button inside it */
.docrow.clickable{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;transition:.13s}
.docrow.clickable:hover{border-color:#bfe3d6;background:#f7fdfb;box-shadow:0 3px 10px rgba(10,157,120,.08)}

/* "Incomplete section" hint on the Legal nav item */
.ihint{position:relative;display:grid;place-items:center;width:17px;height:17px;border-radius:50%;
  border:1.5px solid #96a7b6;color:#5d7183;font-size:10.5px;font-weight:700;margin-left:8px;
  flex-shrink:0;cursor:help}
.ihint .tip{position:absolute;left:calc(100% + 11px);top:50%;transform:translateY(-50%);
  background:#14273d;color:#fff;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:10px;
  white-space:nowrap;opacity:0;visibility:hidden;transition:.12s;z-index:120;
  box-shadow:0 8px 22px rgba(16,30,50,.22)}
.ihint .tip::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:7px solid transparent;border-right-color:#14273d}
.ihint:hover .tip,.ihint:focus-visible .tip{opacity:1;visibility:visible}

/* ---------- document view (sign / review) ---------- */
.docview h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 24px}
.backlink{border:0;background:transparent;color:var(--teal);font-weight:600;font-size:13.5px;padding:0;
  display:inline-flex;align-items:center;gap:7px;margin-bottom:14px}
.backlink:hover{text-decoration:underline}
.backlink svg{width:15px;height:15px}
.paperframe{border:1px solid #e4eaef;padding:8px;background:#fdfefe;border-radius:3px}
.paperpg{background:#fff;border:1px solid #eef2f5;padding:42px 52px 56px;min-height:600px}
.paperpg .aologo{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:30px}
.paperpg .aologo .mark{width:26px;height:26px;opacity:1}
.paperpg .aologo b{font-size:16px;font-weight:700;line-height:1.05;color:#14273d;letter-spacing:-.01em}
.paperpg h5{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.03em;margin:0 0 30px}
.paperpg p{font-size:11.8px;line-height:1.66;margin:0 0 10px;text-align:justify;color:#1d2b3d}
.paperpg .cl{font-weight:700;margin:16px 0 8px;text-align:left}
.paperpg .ind{padding-left:46px;text-indent:-46px}
.paperpg u{text-decoration:underline}

.sigsec{margin-top:32px}
.sigsec h3{font-size:17.5px;font-weight:600;margin:0 0 18px;letter-spacing:-.01em}
.fld label{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
.fld input{width:100%;padding:13px 15px;border:1px solid var(--line2);border-radius:10px;font-size:15px}
.fld input:focus{outline:2px solid var(--teal-s);border-color:var(--teal)}
.fld input:disabled{background:#f7f9fb;color:var(--ink3);cursor:default}
.chkrow{display:flex;align-items:flex-start;gap:11px;margin-top:22px;font-size:15px}
.chkrow input{width:17px;height:17px;accent-color:var(--teal);margin-top:3px;flex-shrink:0}
.chkrow label{cursor:pointer}
.chkrow input:disabled+label{color:var(--ink2);cursor:default}
.sigdiv{height:1px;background:var(--line);margin:26px 0 22px}
.sigfoot{display:flex;justify-content:flex-end}
.btn.sq{border-radius:9px;padding:13px 30px}
.verchip{display:inline-block;font-size:12.5px;font-weight:500;padding:4px 11px;border-radius:99px;
  background:#F2F4F7;color:#344054;margin-left:12px;vertical-align:3px}
.verchip.cur{background:var(--teal-s);color:var(--teal-ink)}
.docscope{font-size:13px;color:var(--ink3);margin:-16px 0 22px}
.notice.plain{background:#f8fafb;border-color:var(--line2);color:var(--ink2)}
/* Same grey as the acceptance label above it — it is a record, not a status to shout about. */
.signedline{font-size:15px;color:var(--ink2)}

.prev{border:0;background:transparent;color:var(--teal);font-weight:600;font-size:13.5px;padding:2px 0;
  display:inline-flex;align-items:center;gap:6px}
.prev:hover{text-decoration:underline}
.prev svg{width:13px;height:13px;transition:transform .16s}
.prev.open svg{transform:rotate(180deg)}
.oldbox{margin:12px 0 0;border-left:2px solid var(--line2);padding:2px 0 2px 16px}
.oldnote{font-size:12.5px;color:var(--ink3);margin:0 0 8px;line-height:1.5;max-width:64ch}
.oldrow{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2);padding:9px 0;
  border-bottom:1px solid var(--line)}
.oldrow:last-child{border-bottom:0}
.oldrow b{color:var(--ink);font-weight:600}
.oldrow .sp{flex:1}
.prev.showall{margin-top:13px;font-size:13px}
.yeargrp+.yeargrp .yearhd{padding-top:15px}
.yearhd{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em;padding:2px 0 5px;
  display:flex;align-items:center;gap:7px}
.yearhd span{font-weight:500;color:var(--ink3);letter-spacing:0}
.scopenote{font-size:12.5px;color:var(--ink3);margin:-6px 0 16px}

/* ---------- buttons ---------- */
.btn{border-radius:99px;padding:11px 22px;font-size:14.5px;font-weight:600;border:1px solid var(--line2);
  background:#fff;color:var(--ink2)}
.btn:hover{background:#f5f8f9}
.btn.pri{background:linear-gradient(99deg,#009170 29.48%,#3538CD 133.95%);border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(0,145,112,.26)}
.btn.pri:hover{filter:brightness(1.07)}
/* Same ramp at low opacity, so disabled reads as the same button rather than a grey one. */
.btn.pri:disabled{background:linear-gradient(99deg,rgba(0,145,112,.34) 29.48%,rgba(53,56,205,.34) 133.95%);
  box-shadow:none;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;border-color:var(--teal);color:var(--teal-ink)}
.btn.ghost:hover{background:var(--teal-s)}
.btn.sm{padding:8px 16px;font-size:13.5px}

/* ---------- modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,38,60,.52);z-index:100;display:grid;place-items:center;
  padding:28px 28px 84px;overflow:auto}  /* bottom clears the control strip */
.modal{background:#fff;border-radius:20px;box-shadow:var(--sh-lg);width:min(830px,100%);
  max-height:calc(100vh - 112px);display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:26px 30px 0;position:relative;flex-shrink:0}
.mhead h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;padding-right:44px}
.x{position:absolute;right:20px;top:20px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);
  background:#fff;color:var(--ink3);display:grid;place-items:center;padding:0}
.x svg{width:13px;height:13px}
.x:hover{color:var(--ink);border-color:var(--ink3)}
.mbody{padding:20px 30px 24px;overflow:auto}
.mfoot{padding:16px 30px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line);flex-shrink:0}
.mfoot .sp{flex:1}
.footnote{font-size:13.5px;color:var(--amber);flex:1;min-width:200px;line-height:1.45}
.footnote.late{color:var(--od)}

/* project-detail modal extras */
.mhead .titlerow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding-right:44px}
.mhead .titlerow h3{padding-right:0}
.statepill{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
  padding:5px 13px;border-radius:99px;background:var(--amber-s);color:#c2620a;white-space:nowrap}
.statepill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.tcount{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;
  background:#eef2f5;color:var(--ink2);font-size:12.5px;font-weight:600;margin-left:8px;vertical-align:middle}
.typeic{width:20px;height:20px;border-radius:50%;background:#3d4c60;color:#fff;display:inline-grid;
  place-items:center;margin-left:8px;vertical-align:-5px}
.typeic svg{width:12px;height:12px}
.flagrow{display:flex;gap:26px;flex-wrap:wrap;font-weight:500}
.skillsec{margin-top:24px}
.skillsec h4{font-size:16.5px;font-weight:700;margin:0 0 12px}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.skill{border:1px solid var(--line2);border-radius:11px;padding:12px 14px}
.skill b{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.skill .st{font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.skill .st svg{width:14px;height:14px;color:var(--teal)}
.skill .take{font-size:13.5px;color:var(--teal-ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}

.dtable{border-top:1px solid var(--line)}
.dtable .r{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dtable .r .k{width:150px;flex-shrink:0;color:var(--ink2)}
.dtable .r .v{flex:1;font-weight:600}
.pdesc{margin-top:22px}
.pdesc h4{font-size:16.5px;font-weight:700;margin:0 0 9px}
.pdesc p{margin:0 0 11px;color:var(--ink2);font-size:14.5px}
.pdesc ul{margin:0;padding-left:20px;color:var(--ink2);font-size:14.5px}
.pdesc li{margin-bottom:4px}

/* requirement block inside project modal */
/* Sits directly under the project details so it is visible without scrolling. */
.reqs{margin:22px 0 4px;border:1px solid var(--amber-line);background:var(--amber-s);border-radius:14px;
  padding:15px 17px}
.reqs.softonly{border-color:var(--line2);background:#f8fafb}
.reqs h4{margin:0 0 4px;font-size:15px;font-weight:700}
.reqs .sub{font-size:13px;color:var(--ink2);margin-bottom:12px}
/* Everything in the row centres on the same axis — icon, text, button. Most rows are now a
   single line of text sitting next to a 28px icon and a button, so top-aligning the text left it
   riding above both. The tallest case left is three short lines (bank & tax), which still reads
   correctly centred. */
.req{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line2);
  border-radius:11px;padding:13px 15px;margin-bottom:9px}
.req:last-child{margin-bottom:0}
/* Always the same neutral document mark. The badge carries the urgency; the icon just says
   "this is a contract". */
.req .ri{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:#F1F3F7;color:#475569}
.req .ri svg{width:15px;height:15px}
.req .ri.ok{background:var(--teal-s);color:var(--teal)}
.req .rt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.req .rt b{font-size:14px;font-weight:600;line-height:1.4}
.req .rt .reqsub{font-size:12.5px;color:var(--ink3)}
.req .chip{margin-left:0}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.req>.btn{align-self:center;flex-shrink:0}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;
  background:#F2F4F7;color:#344054;margin-left:7px;vertical-align:1px}
/* One chip left in the product — the account prerequisite on bank & tax — so there is no
   longer a second variant to distinguish it from. */
.chip.all{background:#F2F4F7;color:#344054}

/* ---------- doc viewer ---------- */
.viewer{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:min(940px,100%);height:min(88vh,860px);
  display:flex;flex-direction:column;overflow:hidden}
.vhead{background:#f4f7f9;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;
  align-items:center;gap:14px;flex-shrink:0}
.vhead .vt{flex:1;text-align:center;font-size:16px;font-weight:700}
.vpaper{flex:1;overflow:auto;background:#eef2f5;padding:26px}
.vdoc{max-width:660px;margin:0 auto;box-shadow:var(--sh-md)}
.vpager{margin:22px 0 4px}
/* ---------- sign modal (project contracts): full-width dark bar + one white card ----------
   Matches the design: the bar spans the viewport, the card hangs directly under it and holds the
   paper (scrolling on its own), the pager and the signature, so everything to do is in one place. */
.fullview{position:fixed;inset:0;display:flex;flex-direction:column;cursor:default}
.fvbar{flex-shrink:0;height:60px;background:rgba(52,64,84,.94);color:#fff;display:flex;align-items:center;
  gap:14px;padding:0 20px}
.fvbar .x{position:static;background:transparent;border:1.5px solid rgba(255,255,255,.85);color:#fff}
.fvbar .x:hover{background:rgba(255,255,255,.12);border-color:#fff;color:#fff}
/* Secondary action on the dark bar: a white pill, as in the design. */
.fvbar .btn:not(.pri){background:#fff;border-color:transparent;color:var(--ink)}
.fvbar .btn:not(.pri):hover{background:#eef3f6}
.fvbar .vt{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:-.005em}
/* Opaque pastel of the same ramp, so it reads as "not yet" against the dark bar instead of
   blending into it the way a translucent gradient does. */
.fvbar .btn.pri:disabled{background:linear-gradient(99deg,#b4e1d4 29.48%,#bfcde9 133.95%);
  color:#fff;box-shadow:none;filter:none}
/* Bottom padding clears the prototype control strip (fixed, ~58px incl. its offset), so the pager
   and the signature are never hidden behind it. */
.fvbody{flex:1;overflow:auto;display:flex;justify-content:center;padding:24px 20px 84px}
.fvcard{background:#fff;width:min(760px,100%);align-self:flex-start;padding:10px 12px 26px;
  box-shadow:var(--sh-lg);border-radius:8px}
.fvpaper{border:1px solid #e4eaef;border-radius:2px;height:min(52vh,560px);overflow:auto;padding:8px;background:#fdfefe}
.fvpaper .paperpg{min-height:0}
.fvpaper .paperpg h5{text-transform:uppercase;border-bottom:1.5px solid #2b3a4e;padding-bottom:7px;margin-bottom:14px}
.fvpaper .paperpg b.cl{display:block;margin:15px 0 4px;font-size:12px}
.fvcard .vpager{margin:18px 0 0}
/* Download modal: nothing sits under the pager, so the card fills the height below the bar and the
   paper takes whatever is left, instead of stopping at the sign modal's fixed height. */
.fullview[data-v="signed"] .fvcard{align-self:stretch;display:flex;flex-direction:column;padding-bottom:18px}
.fullview[data-v="signed"] .fvpaper{flex:1;height:auto;min-height:260px}
.fullview[data-v="signed"] .vpager{flex-shrink:0}
/* Drive-style PDF view */
/* No backdrop of its own: the shared scrim underneath gives it exactly the sign modal's tint. */
.pdfbody{flex:1;overflow:auto;padding:28px 20px 120px}
.pdfpages{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pdfpg{border:0;box-shadow:0 1px 3px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);min-height:980px}
.pdfctl{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:rgba(32,33,36,.92);color:#e8eaed;border-radius:99px;padding:7px 14px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2;user-select:none}
.pdfctl b{font-weight:600;color:#fff}
.pdfctl i{width:1px;height:18px;background:rgba(255,255,255,.22)}
.pdfctl svg{width:16px;height:16px;opacity:.8}
.pdfctl button{border:0;background:transparent;color:#e8eaed;font-size:18px;line-height:1;width:26px;height:26px;border-radius:50%}
.pdfctl button:hover:not(:disabled){background:rgba(255,255,255,.12)}
.pdfctl button:disabled{opacity:.35;cursor:default}
@media (max-width:640px){.pdfbody{padding:16px 8px 110px}.pdfpg{min-height:0}}
.fvcard .vnote{margin:6px 6px 12px;max-width:none}
.fvsig{padding:26px 36px 0}
.fvsig h3{font-size:15px;font-weight:600;margin:0 0 14px}
.fvsig .fld label{font-size:13px;margin-bottom:6px}
.fvsig .fld input{padding:11px 13px;font-size:14.5px}
.fvsig .chkrow{margin-top:14px;font-size:13.5px}
.fvsig .chkrow input{width:15px;height:15px;margin-top:2px}
@media (max-width:640px){.fvbar{padding:0 12px}.fvbody{padding:16px 0 76px}.fvsig{padding:22px 14px 0}}

/* Signature block inside the signing viewer: sits under the paper, same width, on white. */
.vsig{max-width:660px;margin:22px auto 4px;background:#fff;border-radius:12px;padding:22px 26px 24px;
  box-shadow:var(--sh-md)}
.vsig h3{font-size:16px;font-weight:600;margin:0 0 14px}
.vsig .chkrow{margin-top:16px;font-size:14.5px}
.vnote{max-width:660px;margin:0 auto 18px}
.paper{background:#fff;max-width:660px;margin:0 auto;padding:44px 52px;box-shadow:var(--sh-md);
  font-size:12.5px;line-height:1.65;color:#2b3a4e}
.paper h5{margin:0 0 14px;font-size:14px;text-align:center;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1.5px solid #2b3a4e;padding-bottom:7px}
.paper b.cl{display:block;margin:15px 0 4px;font-size:12.5px}
.paper p{margin:0 0 9px}

/* ---------- sign dialog ---------- */
.signbox{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:min(430px,100%);padding:24px 26px 22px;
  position:relative}
.signbox .ok{width:36px;height:36px;border-radius:50%;background:var(--teal-s);color:var(--teal);
  display:grid;place-items:center;margin-bottom:14px}
.signbox .ok svg{width:19px;height:19px}
.signbox h4{margin:0 0 6px;font-size:17px;font-weight:700}
.signbox p{margin:0 0 16px;font-size:13.5px;color:var(--ink2);line-height:1.5}
/* Direct children only. As plain descendant selectors these also matched the checkbox row,
   stretching the checkbox to 100% width and shoving its label out of the dialog. */
.signbox>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.signbox>input{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;font-size:14.5px}
.signbox>input:focus{outline:2px solid var(--teal-s);border-color:var(--teal)}
.signbox .chkrow{margin-top:16px;font-size:14px;line-height:1.45}
.signbox .row{display:flex;gap:10px;margin-top:18px}
.signbox .row .btn{flex:1;justify-content:center}

/* ---------- toast ---------- */
/* ---------- contract gate ----------
   Sits over the portal rather than replacing it, so the agent keeps their bearings. It is not
   a modal though: no X, no click-outside, no Escape. Log out and support live inside it, or
   an agent who disputes the terms would be trapped behind the scrim with nobody to ask. */
.gateinline{padding:0;overflow:hidden}
.gateinline .gatehead{padding-top:24px}
.gatescrim{position:fixed;inset:0;z-index:400;background:rgba(224,235,240,.74);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:26px 26px 84px;overflow:auto}  /* bottom clears the control strip */
.gatemodal{background:#fff;border-radius:20px;box-shadow:var(--sh-lg);width:min(880px,100%);
  max-height:calc(100vh - 110px);display:flex;flex-direction:column;overflow:hidden}
.gatehead{padding:24px 30px 0;flex-shrink:0}
.gatehead h3{margin:0 0 7px;font-size:20px;font-weight:700;letter-spacing:-.015em;
  display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.gatehead p{margin:0;font-size:14px;color:var(--ink2);line-height:1.55;max-width:74ch}
.gatebody{padding:20px 30px 6px;overflow:auto}
.gatefoot{border-top:1px solid var(--line);padding:14px 30px 18px;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;flex-shrink:0}
.gatefoot .sp{flex:1}
.gatefoot .lnk{border:0;background:transparent;color:var(--ink2);font-size:13.5px;font-weight:600;
  padding:9px 12px;border-radius:9px}
.gatefoot .lnk:hover{background:#f2f5f8;color:var(--ink)}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:520;display:flex;
  flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{background:#14273d;color:#fff;border-radius:11px;padding:12px 18px;font-size:14px;
  box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:center;animation:tin .22s ease}
.toast svg{width:16px;height:16px;color:#4ade9b;flex-shrink:0}
@keyframes tin{from{opacity:0;transform:translateY(9px)}}

/* ---------- contract details & execution page (project contracts) ----------
   One template for every project contract, whatever its fields are called. The contract's own
   pages go in untouched; this page is added after them and fills in their blanks. */
.paperpg .blank{display:inline-block;min-width:96px;border-bottom:1px solid #1d2b3d;height:1em;vertical-align:-3px}
.osig{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.osig>div{border-top:1px solid #1d2b3d;padding-top:7px;font-size:10.8px;line-height:1.55;color:#4a5a71}
.osig .nm{display:block;min-height:28px;margin-top:-34px;margin-bottom:6px;
  font-family:'Segoe Script','Brush Script MT','Snell Roundhand',cursive;font-size:20px;color:#14273d}
.xp .xphead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  border-bottom:1.5px solid #14273d;padding-bottom:10px;margin-bottom:14px}
.xp .xphead b{display:block;font-size:10px;letter-spacing:.09em;color:#14273d}
.xp .xphead h6{margin:4px 0 0;font-size:15px;font-weight:700;color:#14273d;letter-spacing:-.005em}
.xp .xphead span{font-size:10px;color:#7c8a9c;text-align:right;line-height:1.5}
.xp .xpterms{background:#f7f9fb;border:1px solid #e8eef1;border-radius:4px;padding:10px 12px;margin-bottom:6px}
.xp .xpterms p{font-size:10.4px;line-height:1.55;margin:0 0 6px}
.xp .xpterms p:last-child{margin:0}
.xp .xps{font-size:11px;font-weight:700;color:#14273d;margin:14px 0 3px}
.xp table{width:100%;border-collapse:collapse;font-size:10.9px}
.xp td{padding:5px 0;border-bottom:1px solid #eef2f5;vertical-align:top;color:#1d2b3d}
.xp td:first-child{width:36%;color:#5b6b80;padding-right:12px}
.xp .xpsig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px}
.xp .sigc{border:1px solid #dbe4ea;border-radius:4px;padding:10px 12px;font-size:10.3px;line-height:1.6;color:#4a5a71}
.xp .sigc .who{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:#7c8a9c}
.xp .sigc .nm{font-family:'Segoe Script','Brush Script MT','Snell Roundhand',cursive;font-size:19px;
  color:#14273d;line-height:1.35;margin:2px 0 1px}
.xp .sigc .es{color:var(--teal-ink);font-weight:700}
.xp .xpfoot{margin-top:14px;padding-top:8px;border-top:1px solid #e8eef1;font-size:9.6px;color:#7c8a9c;line-height:1.65}
.xp .xpfoot code{font-family:ui-monospace,Menlo,monospace;font-size:9.3px;color:#4a5a71}


/* ---------- background check consent & declaration (matches Figma, Dec 2025) ---------- */
.bgwrap{max-width:680px}
.bgwrap h2{font-size:18px;font-weight:600;margin:0 0 22px}
.bgp{font-size:14px;color:var(--ink2);line-height:1.6;margin:0 0 16px}
.bgp b{color:var(--ink)}
.bglead{font-size:14px;font-weight:600;color:var(--ink);line-height:1.55;margin:0 0 16px}
.bgill{display:block;height:auto;margin:4px 0 18px}
.bgbox{border:1.5px solid;border-radius:12px;padding:16px 20px;font-size:13.5px;color:var(--ink);line-height:1.55}
.bgbox.red{border-color:#f6c6cb;background:#fff}
.bgbox.amber{border-color:#f5e7b0;background:#fffdf6}
.bgbox p{margin:0 0 6px}.bgbox ul{margin:0 0 12px;padding-left:22px}
.bgbox .chkrow{margin-top:14px;font-size:13.5px;gap:10px}
.bgbox.amber .chkrow{margin-top:0}
.bgbox .chkrow input{width:16px;height:16px;margin-top:2px}
.bgq{margin-top:4px}
.bgqr{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;padding:11px 14px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.bgqr:nth-child(odd){background:#f5f7f9}
.bgql{position:relative;padding-left:14px}
.bgql::before{content:'•';position:absolute;left:0}
.bgrad{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.bgrad input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.bgfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.btn.bgbtn{border-radius:8px;padding:10px 28px;font-size:14px}
.bgview input:disabled{accent-color:#98a2b3;opacity:.6;cursor:default}
.bgview input:disabled+label,.bgview .bgrad{cursor:default}
.btn.bgbtn:not(.pri){border-color:var(--line2);color:var(--ink)}
@media (max-width:640px){.bgqr{gap:12px;padding:11px 10px}}

/* ---------- locked project: banner + disabled table (replaces the in-page gate) ---------- */
.pbanner{display:flex;align-items:flex-start;gap:12px;background:#fffcf0;border:1px solid #f4d78b;
  border-radius:10px;padding:14px 16px;margin:0 0 18px;font-size:13.5px;line-height:1.5;color:#b54708}
.pbic{color:#dc6803;flex-shrink:0;margin-top:1px;display:grid;place-items:center}
.pbic svg{width:19px;height:19px}
.pbtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pbh{font-weight:600;color:#b54708}
.pbbtn{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);
  color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;margin-left:12px}
.pbbtn svg{width:15px;height:15px}
.pbbtn:hover{background:#f7f9fa}
.subtab:disabled,.selpill:disabled{opacity:.45;cursor:not-allowed}
.subtab:disabled:hover{color:inherit}.selpill:disabled:hover{background:#fff}
.dashlock{opacity:.5;pointer-events:none;user-select:none;filter:grayscale(.35)}
.projgrp{transition:box-shadow .3s}
.projgrp.flash{box-shadow:0 0 0 3px var(--amber-line)}
@media (max-width:640px){.pbanner{flex-wrap:wrap}.pbbtn{margin-left:31px}}

/* ---------- Earnings, Referrals, Schedule (brought over from the current-scope prototype) ---------- */
/* ---------- wallet ---------- */
.walgrid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:22px;align-items:start}
@media(max-width:1180px){.walgrid{grid-template-columns:1fr}.walside{display:none}}
.walmain{min-width:0}
.waltop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:22px;
  align-items:stretch}
@media(max-width:860px){.waltop{grid-template-columns:1fr}}
/* Landscape, not square. The Withdraw card's content sets the height of the pair, so the
   spacing inside it is what was pushing both cards towards a square — the balance card just
   stretches to match. Trimmed there rather than by capping this one, which would have left the
   two mismatched. */
.balcard{position:relative;border-radius:18px;padding:22px 26px 24px;color:#fff;display:flex;
  flex-direction:column;justify-content:center;min-height:150px;
  background:linear-gradient(135deg,#4f57d8 0%,#3f8fd0 48%,#2fbba0 100%)}
.balcard .mark{position:absolute;top:20px;right:22px;width:24px;height:24px}
.balcard .mark i{background:rgba(255,255,255,.92)}
.balcard .bl{font-size:14.5px;font-weight:600;opacity:.92;margin-bottom:8px}
.balcard .bn{font-size:37px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.balcard .bn span{font-size:28px;margin-right:2px;vertical-align:2px}
.wdcard{border-radius:18px;padding:18px 20px 17px;display:flex;flex-direction:column;
  border:1px solid #b3ded5;
  background:linear-gradient(150deg,#dff3ef 0%,#eaf6f2 55%,#d8efe9 100%)}
.wdcard h3{margin:0 0 9px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.wdacct{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);margin-bottom:9px}
.wdacct b{color:var(--ink);font-weight:600}
.wdedit{border:0;background:transparent;margin-left:auto;color:var(--ink2);padding:2px;
  display:grid;place-items:center}
.wdedit svg{width:17px;height:17px}
.wdedit:hover{color:var(--teal-ink)}
.wdlab{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.wdinput{width:100%;padding:10px 14px;border:1px solid #fff;border-radius:9px;font-size:14.5px;
  font-weight:500;background:#fff;color:var(--ink);margin-bottom:11px}
.wdcard .btn.pri{margin-top:auto;padding:10px 22px}
/* the line under the button */
.wdnote{margin:9px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink2)}
/* transaction history */
.txcard{padding:0;overflow:hidden}
.txttl{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;padding:20px 24px}
.txtbl{width:100%;border-collapse:collapse;font-size:14px}
.txtbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:13px;padding:11px 24px;
  background:#fafbfc;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.txtbl td{padding:15px 24px;border-bottom:1px solid var(--line);vertical-align:middle}
.txtbl tr:last-child td{border-bottom:0}
.txd{color:var(--ink);white-space:nowrap}
.txn{font-size:14px;color:var(--ink)}
.txid{font-size:12px;color:var(--ink3);margin-top:2px}
.txa{text-align:right;white-space:nowrap;font-weight:500}
.txa.pos{color:var(--teal-ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:5px 11px;border-radius:99px;white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.pill.dep{background:var(--teal-s);color:var(--teal-ink)}
.pill.pend{background:#fdf2df;color:#a4650b}
.pill.err{background:#fdecea;color:#c8372a}
.pill.paid{background:#eef1f4;color:#516175}
.txpager{margin:18px 0;padding-bottom:6px}
/* right rail */
.walside{position:sticky;top:24px;max-height:calc(100vh - 48px);
  border-radius:18px;overflow:hidden;padding:24px 20px 0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#e4f0f8 0%,#eaf4fa 45%,#eef7fb 100%)}
.walinfo{display:flex;flex-direction:column;gap:17px;margin-bottom:18px;flex:none}
/* One line per row. Letting these wrap put "Daily transfer from 10am onwards" under its own
   heading while the other three stayed inline, so the set stopped reading as a set. */
.wrow{display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap}
.wic{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink2);display:grid;
  place-items:center;flex:none;box-shadow:0 1px 3px rgba(16,30,50,.08);align-self:center}
.wic svg{width:15px;height:15px}
.wrow b{font-size:16.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;flex:none}
.wrow .wv{font-size:12.5px;color:var(--ink2);min-width:0;line-height:1.35}
/* Shrinks to whatever room is left once the rail is pinned, rather than being clipped. */
.walart{display:block;width:100%;max-width:300px;margin:auto auto 0;mix-blend-mode:multiply;
  flex:1;min-height:0;object-fit:contain;object-position:bottom}
/* ---------- referrals ---------- */
/* The artwork is page furniture: it sits behind every card and takes no clicks. */
.refpage{position:relative;z-index:0}
.refart{position:absolute;right:-18px;bottom:-8px;width:min(720px,82%);z-index:0;
  pointer-events:none;user-select:none}
.refpage > *:not(.refart){position:relative;z-index:1}
.refhead{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.refttl h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.refttl p{margin:0;font-size:14.5px;color:var(--ink2)}
.refinv{margin-left:auto;display:inline-flex;align-items:center;gap:9px;padding:12px 24px;
  font-size:15px;flex:none}
.refinv svg{width:18px;height:18px}
.refgrid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;align-items:start}
@media(max-width:1240px){.refgrid{grid-template-columns:1fr}.refart{display:none}}
.refmain{min-width:0}
.refstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.statcard{background:#fff;border-radius:16px;padding:20px 22px;box-shadow:var(--sh-md);
  display:flex;align-items:center;gap:14px}
.statcard b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.statcard .sl3{font-size:13.5px;color:var(--ink2)}
.sic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:13px;font-weight:700}
.sic.coin{background:#fde7bd;color:#a4650b;font-size:17px}
.sic.lvl{background:var(--teal-s);color:var(--teal-ink);font-size:12.5px}
.reftbl{padding:0;overflow:hidden}
.rthead{display:flex;align-items:center;gap:16px;padding:18px 22px;flex-wrap:wrap}
.rthead h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.rthead .sp{flex:1}
.rsearch{position:relative;display:flex;align-items:center;min-width:240px}
.rsearch svg{position:absolute;left:13px;width:16px;height:16px;color:var(--ink3)}
.rsearch input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line2);
  border-radius:99px;font-size:14px;background:#fff}
.rsearch input::placeholder{color:var(--ink3)}
.rtbl{width:100%;border-collapse:collapse;font-size:14px}
.rtbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:13px;padding:11px 22px;
  background:#fafbfc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  white-space:nowrap}
.rtbl td{padding:13px 22px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtbl tbody tr:last-child td{border-bottom:0}
.rtbl.mini th,.rtbl.mini td{padding:11px 18px;font-size:13.5px}
.rtbl.mini th{line-height:1.25}
.nowrap{white-space:nowrap}
.rname{display:flex;align-items:center;gap:11px;font-weight:500;color:var(--ink)}
/* Renamed from .rav — that is the nav rail's own avatar, and a second definition of it was
   quietly resizing the one in the rail on every page. */
.refav{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:var(--ink2)}
.rmail{word-break:break-word;font-weight:400}
.kb{border:0;background:transparent;color:var(--ink3);padding:2px;display:grid;place-items:center}
.kb:hover{color:var(--ink)}
.kb svg{width:16px;height:16px}
/* gate progress */
.gcell{white-space:nowrap}
.gfill{display:block;height:100%;border-radius:99px;background:#12b981;position:relative}
.gfill.done{background:#0ba97a}
.gtick{position:absolute;right:0;top:50%;transform:translateY(-50%);width:13px;height:13px;
  border-radius:50%;background:#fff;color:#0ba97a;display:grid;place-items:center}
.gtick svg{width:8px;height:8px}
.gmins{margin-left:14px;font-size:13px;color:var(--ink2)}
.gmins b{color:var(--ink);font-weight:600}
/* right rail */
.refside{display:flex;flex-direction:column;gap:20px;min-width:0}
.refpol{display:flex;align-items:center;gap:13px;padding:18px 20px;text-align:left;border:0;
  font:inherit;width:100%}
.refpol b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.refpol .sp{flex:1}
.refpol svg{width:19px;height:19px;color:var(--ink2);flex:none}
.refpol:hover{box-shadow:var(--sh-lg)}
.polic{width:36px;height:36px;border-radius:50%;background:var(--teal-s);color:var(--teal-ink);
  display:grid;place-items:center;flex:none}
.polic svg{width:19px;height:19px;color:currentColor}
.refpend,.reftop{padding:0;overflow:hidden}
.refpend h3,.reftop h3{margin:0;font-size:16px;font-weight:700;padding:16px 18px;
  letter-spacing:-.02em}
.refpg{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  font-size:13.5px;color:var(--ink2)}
.rnd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:#fff;
  display:grid;place-items:center;color:var(--ink2);flex:none}
.rnd:hover{background:#f5f8f9}
.rnd svg{width:16px;height:16px}
/* ---------- schedule ---------- */
/* stretch, not start: the artwork column is a full-height panel that the calendar sets the
   height of, the way it is in the real screen. */
.schgrid{display:grid;grid-template-columns:372px minmax(0,1fr);gap:18px;align-items:stretch}
/* Just padding and stacking — the artwork is painted by .main::before below, which is anchored
   to the page container rather than to this grid item, so it cannot be knocked out of alignment
   by the grid's own maths. */
.schside{position:relative;z-index:1;padding:34px 20px 40px 18px;display:flex;
  flex-direction:column;gap:18px}
/* The artwork is painted on the page container, not on a grid item: .main's padding box starts
   exactly at the nav rail, so left:0 is flush by definition — no negative margin has to guess at
   the page's own padding. top/bottom:0 covers the full scroll height including whatever footer
   space the widget has opened up, so it always reaches both edges. 424px = the column plus the
   page padding plus the gap, so it ends exactly where the calendar card begins. */

@media(max-width:1180px){body.sched .main::before{display:none}}
.schgrid{position:relative;z-index:1}
.schside .pcard{flex:none}
@media(max-width:1180px){.schgrid{grid-template-columns:1fr}}
.schproj h3{margin:0 0 12px;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.schlist{border:1px solid var(--line2);border-radius:12px;padding:5px;max-height:214px;
  overflow:auto;margin-bottom:14px}
.schrow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;
  background:transparent;border-radius:8px;font-size:13.5px;color:var(--ink);text-align:left}
.schrow .snm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schrow .lockchip{font-size:10px;padding:2px 7px;flex:none}
.schrow:hover{background:#f5f8f9}
.schrow.on{background:var(--teal-s)}
.sradio{width:16px;height:16px;border-radius:50%;border:2px solid;flex:none;position:relative}
.schrow.on .sradio::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:#fff}
.schedit{display:inline-flex;align-items:center;gap:8px;padding:9px 17px;font-size:13.5px;align-self:flex-start}
.schedit svg{width:15px;height:15px}
.schtot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;
  color:var(--ink2)}
.schtot b{color:var(--ink);font-size:16px;font-weight:700;margin-left:8px}
.prefhd{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.prefhd b{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.prefic{width:32px;height:32px;border-radius:50%;background:var(--teal-s);color:var(--teal-ink);
  display:grid;place-items:center;flex:none}
.prefic svg{width:16px;height:16px}
.schpref p{margin:0 0 10px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.schpref p:last-child{margin-bottom:0}
.schpref a{color:var(--ink);font-weight:600;text-decoration:underline}
/* ---------- the calendar ---------- */
.schcal{padding:0;overflow:hidden;min-width:0}
.calmon{text-align:center;font-size:15px;font-weight:600;color:var(--ink2);padding:18px 0 4px}
.caldays{display:flex;align-items:center;gap:8px;padding:0 14px 14px}
.calnav{width:34px;height:34px;border:0;background:transparent;border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--ink2)}
.calnav:hover{background:#f2f6f8}
.calnav svg{width:18px;height:18px}
.calstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1;gap:4px}
.calday{border:0;background:transparent;border-radius:99px;padding:8px 4px;display:flex;
  flex-direction:column;align-items:center;gap:1px;color:var(--ink2)}
.calday .cd{font-size:13px}
.calday b{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.calday:hover{background:#f2f6f8}
.calday.on{background:linear-gradient(135deg,#0e7f74,#14a08c);color:#fff}
.calday.on b{color:#fff}
.calbody{border-top:1px solid var(--line);max-height:560px;overflow:auto}
.calrow{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr))}
.caltime{font-size:13.5px;color:var(--ink2);padding:22px 14px 0;text-align:right;white-space:nowrap}
.cell{position:relative;min-height:67px;padding:11px 12px;border-bottom:1px dashed var(--line);
  border-right:1px solid #eef2f5;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell .cl{font-size:13px;font-weight:600;line-height:1.25}
.cell .cc{font-size:12.5px}
.cell.a{background:#f2fbf7}.cell.a .cl{color:var(--teal-ink)}.cell.a .cc{color:var(--ink2)}
.cell.f{background:#fdf4f3}.cell.f .cl{color:#e07a6d}.cell.f .cc{color:#e6a49a}
/* Committed is the agent's own booking, so it gets a solid edge rather than another tint —
   at a glance the eye needs to find "mine" before it reads any of the numbers. */
.cell.c{background:#dff2ea;border-left:2px solid #0a9d78;border-right:2px solid #0a9d78}
.cell.c .cl{color:#07785c}.cell.c .cc{color:#0a9d78}
.cell.n{background:#f1f3f5}.cell.n .cl{color:var(--ink3)}
.cell.z{background:#fafbfc}.cell.z .cl{color:#b6c0cb}.cell.z .cc{color:#c8d0d8}
.newtag{position:absolute;right:6px;bottom:6px;background:#475467;color:#fff;font-size:9.5px;
  font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px}
@media(max-width:1180px){.dashgrid{grid-template-columns:1fr}.dashside{display:none}}/* referral gate bar (renamed from .gbar, which is the setup-guide progress bar in this file) */
.refgbar{display:inline-block;width:150px;height:9px;border-radius:99px;background:var(--teal-s);
  vertical-align:middle;overflow:hidden}

/* ---------- coaching: achievements, self planner, resources ---------- */
.cohd{font-size:19px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.cogrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px}
.cocol{display:flex;flex-direction:column;gap:14px}
.cobox{border:1px solid var(--line2);border-radius:14px;padding:16px;text-align:center}
.cottl{font-size:14px;font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.cosub{font-size:13.5px;color:var(--ink2);line-height:1.5;margin:0 0 12px;text-align:center}
.costreak{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.costreak i{height:13px;border-radius:2px;background:#e3f6ef;font-style:normal;font-size:9px;line-height:13px}
.costreak i.on{background:#12b981}
.cobadge{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:12px;font-size:13px}
.cobadge b{font-weight:600}.cobadge span{color:var(--ink3)}
.cobic{position:relative;width:52px;height:52px;border-radius:50%;background:#e6f7f0;display:grid;place-items:center;font-size:24px}
.cobic em{position:absolute;right:-8px;bottom:0;background:#4f46e5;color:#fff;font-style:normal;font-size:11px;border-radius:99px;padding:1px 6px}
.colb{text-align:left;padding:0;overflow:hidden}
.colbhd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.colbhd .sp{flex:1}
.copill{font-size:12px;background:#eef2ff;color:#4338ca;border-radius:99px;padding:3px 10px}
.colbt{width:100%;border-collapse:collapse;font-size:13.5px}
.colbt th{text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:9px 16px;background:#fafbfc}
.colbt td{padding:9px 16px;border-top:1px solid var(--line);vertical-align:middle}
.colbt tr.me td{background:#e6f7f0}
.corank{display:inline-grid;place-items:center;width:24px;height:26px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:#1e2a78;color:#fff;font-size:12px;font-weight:700}
.corank.r1{background:#2e3a8c}.corank.r3{background:#5a3db8}
.coav{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f2f4f7;font-size:10px;color:var(--ink2);margin-right:8px}
.cogem{font-size:11px;color:#4338ca;margin-left:4px}
.cometa{display:flex;gap:6px;margin-top:4px}
.cometa span{font-size:11px;background:#f2f4f7;border-radius:4px;padding:1px 6px;color:var(--ink2)}
.cogrid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px}
.coplan{position:relative;overflow:hidden;min-height:300px;background-color:#fff;background-size:cover;background-position:right bottom;background-repeat:no-repeat}
.coplan>*{position:relative}
.coplh{font-size:24px;font-weight:700;margin:26px 0 10px}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cotile{border:1px solid var(--line2);border-radius:12px;background:#fff;padding:16px;text-align:left;font-size:14px;font-weight:500;
  display:flex;flex-direction:column;gap:10px;min-height:110px;color:var(--ink)}
.cotile:hover{border-color:#bfe3d6}
.coic{width:34px;height:34px;border-radius:50%;background:#e6f7f0;color:var(--teal);display:grid;place-items:center;font-size:17px}
.lockable:disabled{opacity:.45;cursor:not-allowed}
.cotile:disabled:hover{border-color:var(--line2)}
@media (max-width:980px){.cogrid,.cogrid2{grid-template-columns:1fr}}

/* ---------- prototype controls: one low pill strip, out of the way ---------- */
/* Single row, always. Wrapping turned the pill into a blob, so it scrolls instead. */
/* Above the platform gate. The strip is not part of the product — it is the control panel for
   demoing it — so being trapped behind the very scrim it sets up would make it useless. */
.strip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:500;
  background:#22303f;color:#fff;border-radius:99px;padding:6px 8px;display:flex;align-items:center;gap:6px;
  box-shadow:0 12px 32px rgba(16,30,50,.30);font-size:12px;flex-wrap:nowrap;
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.scopetag{background:rgba(11,185,138,.18);color:#7ff0cd;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:99px;white-space:nowrap}
.strip .sl{color:#8ba0b5;padding:0 2px 0 7px;white-space:nowrap;font-weight:600;letter-spacing:.02em}
.segwrap{display:flex;background:rgba(255,255,255,.09);border-radius:99px;padding:2px;gap:1px}
.sb{border:0;background:transparent;color:#c3d1de;padding:6px 10px;border-radius:99px;font-size:12px;
  font-weight:600;white-space:nowrap}
.sb:hover{color:#fff}
.sb.on{background:var(--teal);color:#fff}
.pb{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:99px;

/* Legal documents do not expire. An unsigned contract is a blocker, in two tiers:
     · platform contract unsigned  -> the whole portal is gated until it is accepted
     · project contract re-issued  -> that project is inaccessible, others are not
   Project contracts are still signed at apply time; the block only applies to re-issues. */
const S = {
  platform:'signed', due:'p1', bankTax:true, existing:true, gigReqs:false,
  gatePick:null, gateList:false, gatePage:1, gateName:'', gateChk:false, dashProject:'j1', dashSel:false,

/* Legal documents do not expire, and there is no grace period. An unsigned contract is a
   blocker, not a countdown: the platform contract locks the whole portal, a project contract
   locks that project. So there are no deadlines, windows or badges anywhere. */
/* The background check is a consent + declaration step, not a contract: it never gates the
   portal. It gates applying (see requirements()) and is completed in Settings → Legal. */
const platformBlocked = () => PLATFORMDOCS.some(d=>!d.signed && !d.step);
const BGC = () => PLATFORMDOCS.find(d=>d.id==='bgc');

/* Project contracts the agent has already accepted at some version. rv-sow and qa-dha are
   the two the client has re-issued; the Due / State controls decide which are outstanding
   and whether they are still inside their window. */
/* Read-only in this release: signed once, never re-issued. They are viewable so the agent
   can go back and read what they agreed to — the same reason the project ones are. */
const PLATFORMDOCS = [
  /* `edition` is model-only: it never reaches the screen. The platform agreement really does
     vary by jurisdiction — the 2024 Global text and the Spain text are different documents, not
     one improved into the other — but that is a fact for the data layer to carry. Agents see a
     plain version number, which is what the API can be relied on to return. */
  {id:'ica', project:null, title:'Independent Contractor Agreement', edition:'Spain',
   version:2, effective:'2026-09-02', pages:6, signed:true, signedOn:'2026-09-03',
   previous:[{v:1, edition:'2024 Global', effective:'2025-02-01', signed:'2025-02-03'}]},
  /* This one does version in the ordinary way: the same document, revised as data law changes.
     Both kinds of history exist, so the list in the Legal tab has to read correctly for each. */
  {id:'dpa', project:null, title:'Data Processing Agreement', version:2,
   effective:'2026-09-01', pages:4, signed:true, signedOn:'2026-09-02',
   previous:[{v:1, effective:'2025-02-01', signed:'2025-02-03'}]},
  /* Never re-issued: a one-time consent, kept so the Legal tab shows both kinds. */
  {id:'bgc', project:null, title:'Background Check Consent & Criminal History Declaration',
   version:1, effective:'2025-02-01', pages:3, signed:true, signedOn:'2025-02-03', previous:[], step:true}
];
/* Project contracts do not version. A client issues distinct documents — NDA, Statement of
   Work, Data Handling Addendum — and when it needs something more from an agent already on the
   project it adds another one. So there is no V2 of anything here, no version history, and
   nothing to re-sign: a contract is either signed, or newly added and waiting. */
let PROJECTDOCS = [
  {id:'im-ca',  project:'Image Moderation',  title:'Consulting Agreement', version:1,
   effective:'2025-03-04', pages:3, signed:true, signedOn:'2025-03-06', previous:[]},
  {id:'im-tou', project:'Image Moderation',  title:'Terms of Use', version:1,
   effective:'2025-03-04', pages:3, signed:true, signedOn:'2025-03-06', previous:[]},
  /* LEGACY. Signed before the execution page shipped, so its signed copy is the original
     document only — no page N+1. Existing signatures are not
     re-papered. */
  {id:'pz-nda', project:'Large Pizza Project', title:'Project NDA', version:1, legacy:true,
   effective:'2024-11-18', pages:3, signed:true, signedOn:'2024-11-20', previous:[]},

  {id:'rv-nda', project:'RV Rental Platform', title:'Project NDA', version:1,

  {id:'rv-sow', project:'RV Rental Platform', title:'Statement of Work', version:1,
   effective:'2026-09-02', pages:4, signed:false, previous:[]},
  /* RENEWAL. The one exception to "project contracts are signed once". Some countries cap how
     long a single IC engagement can run on one signature — Australia at six months — so the
     client sets a re-signing schedule on the contract and the SAME document comes round again.
     No new upload, no new version, no new row: only the signature expires.
     `renewMonths` and `country` exist purely so every renewal surface can say why. The clock
     runs from `signedOn` — this agent's own signature — never from the upload date, so two
     agents on the same contract fall due on different days. */
  {id:'rv-ica', project:'RV Rental Platform', title:'Independent Contractor Agreement', version:1,
   effective:'2026-03-08', pages:4, signed:true, signedOn:'2026-03-10', previous:[],
   country:'Australia', renewMonths:6},

/* A renewal reuses the outstanding-contract mechanism exactly — same widget row, same Legal
   tile, same gate, same card. Nothing new is built. The only difference is what the agent is
   told, so every surface asks this one question and swaps its copy.
   Deliberately no countdown, no warning window, no overdue state: §12 stands, a contract is a
   blocker rather than a timer, and a renewal is no different on the day it falls due. */
const isResign = d => !!(d && d.resign && !d.signed);
/* The sentence the whole feature turns on. Said once here so the gate, the card and the Legal
   document page cannot drift apart. */
function renewalWhy(d){
  return `Independent contractor engagements in ${esc(d.country)} are limited to

}

}

/* Applying is the ONLY hard gate. It is one well-defined door, it is discretionary, and it
   risks no existing income. Working is reached through many doors — the dashboard project
   switcher, Handle Contacts Now, task claim, deep links — so gating it would be both leaky
   and, for a contractor paid per task, a block on that day's earnings.
   Everything outstanding for a project is surfaced as a reminder instead. */
function outstandingFor(projectName){
  const out = requirements().map(r => Object.assign({}, r, {late:false}));
  PROJECTDOCS.filter(d=>d.project===projectName && !d.signed).forEach(d=>out.push({
    key:d.id, scope:'project', blocks:true,
    label:d.title,
    /* No sub-line. A client cannot schedule when its contract takes effect, so there is no
       effective date to show — and every other candidate (the project, the fact that it blocks
       this project) is already said by the block this row sits inside. */
    sub:'',
    cta:'Review & sign', act:"openLegalDoc('"+d.id+"')"
  }));
  return out;
}

/* ============================================================
